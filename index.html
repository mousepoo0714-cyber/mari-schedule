<title>마리스케쥴러</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

  :root{
    --bg:#F6F3EC;
    --surface:#FFFFFF;
    --surface-2:#FBF9F4;
    --ink:#2E2B26;
    --ink-soft:#726C5F;
    --ink-faint:#A39C8C;
    --accent:#4F7A5B;
    --accent-ink:#FFFFFF;
    --accent-soft:#DCEAE0;
    --line:#E4DFD3;
    --line-strong:#D2CBBA;
    --danger:#B23B23;
    --danger-soft:#F5DFD8;
    --sat-ink:#3B6E9A;
    --shadow: 0 12px 28px -14px rgba(46,43,38,.28);

    --tag-0:#B5573C; --tag-0-soft:#F6E3DC;
    --tag-1:#A9822C; --tag-1-soft:#F3E9CE;
    --tag-2:#2C7A7B; --tag-2-soft:#DCEEEE;
    --tag-3:#3B6E9A; --tag-3-soft:#DCE8F2;
    --tag-4:#7B4B94; --tag-4-soft:#EBDEF0;
    --tag-5:#B24D6B; --tag-5-soft:#F5DEE5;
    --tag-6:#6B7A3B; --tag-6-soft:#E7ECD8;
    --tag-7:#55606E; --tag-7-soft:#E3E6EA;
    --tag-8:#C08A2E; --tag-8-soft:#F5E6CB;
    --tag-9:#4B5FA8; --tag-9-soft:#DEE3F5;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C1B17;
      --surface:#242219;
      --surface-2:#2A281F;
      --ink:#EFEAE0;
      --ink-soft:#B3AB99;
      --ink-faint:#7D7666;
      --accent:#7BAE8B;
      --accent-ink:#15251A;
      --accent-soft:#28352A;
      --line:#37342A;
      --line-strong:#454133;
      --danger:#E08469;
      --danger-soft:#3A241D;
      --sat-ink:#7FAAD4;
      --shadow: 0 12px 28px -14px rgba(0,0,0,.5);

      --tag-0:#E08A6E; --tag-0-soft:#3A2620;
      --tag-1:#D9B25C; --tag-1-soft:#372C16;
      --tag-2:#4FA3A4; --tag-2-soft:#163333;
      --tag-3:#6B9FC9; --tag-3-soft:#1C2E3D;
      --tag-4:#B586CB; --tag-4-soft:#2E2438;
      --tag-5:#D9829D; --tag-5-soft:#3A222A;
      --tag-6:#A3B36B; --tag-6-soft:#2A2E1A;
      --tag-7:#93A0AF; --tag-7-soft:#262A30;
      --tag-8:#E0B863; --tag-8-soft:#3A2E18;
      --tag-9:#8B9AD6; --tag-9-soft:#262C3E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C1B17;
    --surface:#242219;
    --surface-2:#2A281F;
    --ink:#EFEAE0;
    --ink-soft:#B3AB99;
    --ink-faint:#7D7666;
    --accent:#7BAE8B;
    --accent-ink:#15251A;
    --accent-soft:#28352A;
    --line:#37342A;
    --line-strong:#454133;
    --danger:#E08469;
    --danger-soft:#3A241D;
    --sat-ink:#7FAAD4;
    --shadow: 0 12px 28px -14px rgba(0,0,0,.5);

    --tag-0:#E08A6E; --tag-0-soft:#3A2620;
    --tag-1:#D9B25C; --tag-1-soft:#372C16;
    --tag-2:#4FA3A4; --tag-2-soft:#163333;
    --tag-3:#6B9FC9; --tag-3-soft:#1C2E3D;
    --tag-4:#B586CB; --tag-4-soft:#2E2438;
    --tag-5:#D9829D; --tag-5-soft:#3A222A;
    --tag-6:#A3B36B; --tag-6-soft:#2A2E1A;
    --tag-7:#93A0AF; --tag-7-soft:#262A30;
    --tag-8:#E0B863; --tag-8-soft:#3A2E18;
    --tag-9:#8B9AD6; --tag-9-soft:#262C3E;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    font-variant-numeric: tabular-nums;
    padding-inline: 20px;
    padding-block: 0 calc(56px + env(safe-area-inset-bottom, 0px));
  }
  h1,h2,h3{ font-family:'Noto Serif KR', serif; font-weight:700; margin:0; text-wrap:balance; }
  .wrap{ max-width: 980px; margin: 0 auto; }
  .auth-wrap{ padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  button{ font-family:inherit; cursor:pointer; }
  input, select{ font-family:inherit; }

  /* ---------- shell / loading ---------- */
  .center-screen{
    min-height: 70vh; display:flex; align-items:center; justify-content:center;
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    box-shadow: var(--shadow); padding: 32px 28px;
  }
  .brand-eyebrow{
    font-size:.78rem; letter-spacing:.08em; color:var(--ink-soft); font-weight:600;
  }
  .muted{ color:var(--ink-soft); }
  .faint{ color:var(--ink-faint); }
  .small{ font-size:.78rem; }

  /* ---------- setup / auth ---------- */
  .auth-shell{ max-width: 420px; margin: 6vh auto 0; padding-top: env(safe-area-inset-top, 0px); }
  .auth-shell .card{ padding: 30px 26px; }
  .field{ margin-top:16px; }
  .field label{ display:block; font-size:.85rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field .hint{ font-size:.76rem; color:var(--ink-faint); margin-top:5px; line-height:1.5; }
  .field input, .field select{
    width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--line-strong);
    background:var(--surface-2); color:var(--ink); font-size:1rem;
  }
  .field input:disabled{ opacity:.6; }
  .field input:focus, .field select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding: 11px 18px; border-radius:10px; border:1px solid transparent;
    font-weight:600; font-size:.95rem; transition: filter .12s ease;
  }
  .btn:hover{ filter:brightness(0.95); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); width:100%; margin-top:20px; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line-strong); }
  .btn-line{ background:var(--surface-2); color:var(--ink); border-color:var(--line-strong); }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); }
  .btn-sm{ padding:7px 12px; font-size:.83rem; border-radius:8px; }
  .err-msg{ margin-top:14px; color:var(--danger); font-size:.88rem; font-weight:600; }
  .link-btn{
    display:block; width:100%; margin-top:14px; padding:6px 0; border:none; background:none;
    font-family:inherit; font-size:.85rem; font-weight:600; color:var(--ink-soft);
    text-decoration:underline; text-underline-offset:3px;
  }
  .link-btn:hover:not(:disabled){ color:var(--ink); }
  .link-btn:disabled{ opacity:.6; cursor:default; }
  .note-msg{ margin-top:14px; color:var(--ink-soft); font-size:.85rem; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; line-height:1.5; }

  .authtabs{ display:flex; gap:6px; margin-top:18px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:4px; }
  .authtab{ flex:1; padding:9px 0; border-radius:9px; border:none; background:transparent; color:var(--ink-soft); font-weight:700; font-size:.88rem; }
  .authtab.active{ background:var(--surface); color:var(--ink); box-shadow: var(--shadow); }

  .form-check{
    display:flex; align-items:flex-start; gap:9px; margin-top:18px; padding:12px 13px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
  }
  .form-check input[type=checkbox]{ margin-top:3px; width:16px; height:16px; accent-color:var(--accent); flex:none; }
  .form-check label{ font-size:.87rem; color:var(--ink); font-weight:600; line-height:1.45; }

  .dot{ width:11px; height:11px; border-radius:50%; flex:none; background:var(--tag-0); }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    /* 좌우 20px 을 뚫고 나가 화면 끝까지 닿는 띠가 됩니다 */
    margin: 0 -20px 18px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 20px 10px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:40;
  }
  /* 배너 전체가 달력으로 가는 버튼이에요 */
  .topbar .whoami{ flex:1; }
  .whoami{
    display:flex; align-items:center; gap:10px; min-width:0;
    background:none; border:none; padding:4px 6px 4px 0; margin:0;
    font-family:inherit; color:inherit; text-align:left; cursor:pointer;
    border-radius:12px;
  }
  .whoami:active{ background:var(--accent-soft); }
  @media (min-width: 720px){
    .topbar{ border-radius:0 0 16px 16px; }
  }
  .whoami-text{ display:flex; flex-direction:column; align-items:flex-start; min-width:0; gap:3px; }
  .whoami-name{ font-weight:700; }
  .home-mark{
    flex:none; display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:8px;
    background:var(--accent-soft); color:var(--accent);
  }
  .avatar{
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; color:var(--accent-ink); background:var(--accent); font-family:'Noto Serif KR',serif;
    flex:none;
  }
  .role-badge{
    font-size:.72rem; font-weight:700; letter-spacing:.04em; color:var(--ink-soft);
    background:var(--surface-2); border:1px solid var(--line); padding:2px 9px; border-radius:999px;
    white-space:nowrap;
  }

  .hamburger-btn{
    width:42px; height:42px; border-radius:11px; border:1px solid var(--line-strong);
    background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; flex:none;
  }
  .hamburger-btn span{ display:block; width:18px; height:2px; background:var(--ink); border-radius:2px; }

  /* ---------- drawer menu ---------- */
  .drawer-overlay{
    position:fixed; inset:0; background:rgba(30,27,20,.42); display:flex;
    justify-content:flex-end; z-index:60;
  }
  .drawer{
    width:280px; max-width:82vw; height:100%; background:var(--surface);
    box-shadow: var(--shadow); padding: 20px 16px; display:flex; flex-direction:column; gap:4px;
    overflow-y:auto;
  }
  .drawer-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; padding:0 4px; }
  .drawer-head h3{ font-size:1.05rem; }
  .drawer-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:12px 12px; border-radius:10px; border:none; background:transparent;
    color:var(--ink); font-weight:600; font-size:.95rem;
  }
  .drawer-item:hover{ background:var(--surface-2); }
  .drawer-item.active{ background:var(--accent-soft); color:var(--accent); }
  .drawer-item.danger{ color:var(--danger); }
  .drawer-sep{ height:1px; background:var(--line); margin:8px 4px; }

  /* ---------- month nav ---------- */
  .monthbar{
    display:flex; align-items:center; justify-content:space-between; margin: 6px 0 14px;
  }
  .monthbar h2{ font-size:1.45rem; }
  .nav-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--line-strong);
    background:var(--surface); color:var(--ink); font-size:1.1rem; display:flex; align-items:center; justify-content:center;
  }
  .nav-group{ display:flex; align-items:center; gap:8px; }

  /* ---------- filter chips (admin) ---------- */
  .chiprow{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
    border:1px solid var(--line-strong); background:var(--surface); font-size:.83rem; font-weight:600; color:var(--ink-soft);
  }
  .chip.active{ background:var(--tag-soft, var(--accent-soft)); color:var(--ink); border-color:transparent; }
  .chip .dot{ width:8px; height:8px; }

  /* ---------- colour-mode toggle ---------- */
  .modebar{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .modebar-label{ font-size:.78rem; font-weight:700; color:var(--ink-soft); }
  .segmented{
    display:inline-flex; gap:2px; padding:3px; border-radius:10px;
    background:var(--surface-2); border:1px solid var(--line);
  }
  .seg{
    border:none; background:transparent; color:var(--ink-soft);
    font-weight:700; font-size:.8rem; padding:5px 14px; border-radius:8px;
  }
  .seg.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }

  /* ---------- 직무 colour swatches ---------- */
  .job-swatch{
    width:15px; height:15px; border-radius:5px; flex:none; padding:0;
    border:1px solid rgba(0,0,0,.14); display:inline-block;
  }
  button.job-swatch:hover{ filter:brightness(.92); }
  .swatch-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:18px; }
  .swatch{ aspect-ratio:1; max-width:100%; border-radius:11px; border:2px solid transparent; padding:0; }
  .swatch.active{ border-color:var(--ink); }
  .swatch:hover{ filter:brightness(.94); }

  /* ---------- calendar ---------- */
  .cal-grid{
    display:grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap:6px;
  }
  .cal-dow{ text-align:center; font-size:.75rem; font-weight:700; color:var(--ink-faint); padding-bottom:4px; }
  .cal-cell{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    min-height:86px; padding:7px 6px; display:flex; flex-direction:column; gap:4px;
    text-align:left; width:100%; min-width:0;
  }
  .cal-cell.out{ background:var(--surface-2); opacity:.55; }
  .cal-cell.today{ border-color:var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cal-daynum{ font-size:.8rem; font-weight:700; color:var(--ink-soft); }
  .cal-cell.today .cal-daynum{ color:var(--accent); }
  .cal-entries{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  /* The column width is fixed; a chip wraps downward instead of widening it,
     so the 내담자 이름과 회차 stay readable even in a narrow phone column. */
  /* One line per entry, always: the column width is fixed, so anything that
     doesn't fit is trimmed rather than wrapped. Details live in the day popup. */
  .cal-chip{
    display:flex; align-items:center; gap:3px; font-size:.64rem; line-height:1.5;
    padding:1px 4px; border-radius:5px; min-width:0;
    background: var(--tag-soft); color: var(--ink); border-left:3px solid var(--tag);
    text-align:left; white-space:nowrap; overflow:hidden;
  }
  .cal-chip-name{ font-weight:700; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .cal-chip-time{ font-weight:600; opacity:.7; flex:none; display:none; }
  @media (min-width: 620px){ .cal-chip-time{ display:inline; } }
  /* 회차: a drawn circle rather than ①②③, so any number renders anywhere. */
  .cal-n{
    flex:none; margin-left:auto; min-width:1.2em; height:1.2em; line-height:1.2em;
    text-align:center; border-radius:50%; background:var(--tag); color:var(--surface);
    font-size:.8em; font-weight:800; padding:0 1px;
  }
  /* 바쁜 날 요약 */
  .cal-total{ font-size:.58rem; font-weight:800; color:var(--ink-soft); line-height:1.4; }
  .cal-sum{
    display:flex; align-items:center; gap:3px; font-size:.6rem; font-weight:700;
    line-height:1.45; white-space:nowrap; overflow:hidden; min-width:0;
  }
  .cal-sum-name{ overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .cal-sum-n{ margin-left:auto; font-weight:800; flex:none; }
  .cal-more{ font-size:.66rem; color:var(--ink-faint); font-weight:600; }
  .cal-dow.sun, .cal-cell.sun .cal-daynum{ color:var(--danger); }
  .cal-dow.sat, .cal-cell.sat .cal-daynum{ color:var(--sat-ink); }
  .cal-cell.today.sun .cal-daynum, .cal-cell.today.sat .cal-daynum{ color:var(--accent); }
  .cal-holiday{
    font-size:.6rem; font-weight:700; color:var(--danger); line-height:1.25;
    overflow-wrap:anywhere; margin-top:-1px;
  }
  .holiday-tag{
    margin-left:9px; font-family:'Noto Sans KR',sans-serif; font-size:.74rem; font-weight:700;
    color:var(--danger); background:var(--danger-soft); padding:3px 10px; border-radius:999px;
    vertical-align:3px;
  }

  @media (max-width: 620px){
    .cal-grid{ gap:4px; }
    .cal-cell{ min-height:64px; padding:4px 2px; border-radius:9px; }
    .cal-dow{ font-size:.66rem; }
    .cal-daynum{ font-size:.72rem; }
    .cal-chip{ font-size:.5rem; padding:1px 2px; border-left-width:2px; gap:1px; }
    .cal-sum{ font-size:.55rem; }
    .cal-total{ font-size:.54rem; }
    .cal-entries{ gap:2px; }
  }

  /* ---------- summary strip ---------- */
  /* 달력 위의 얇은 한 줄 요약 */
  .summary-strip{
    display:flex; align-items:center; flex-wrap:wrap;
    gap:6px 14px; margin: 12px 0 8px;
    font-size:.8rem; color:var(--ink-soft);
  }
  .summary-item{ display:inline-flex; align-items:baseline; gap:4px; white-space:nowrap; }
  .summary-item + .summary-item{
    padding-left:14px; border-left:1px solid var(--line);
  }
  .summary-item b{
    font-family:'Noto Serif KR',serif; font-size:1rem; font-weight:700; color:var(--ink);
  }

  /* 날짜 팝업 — 구성원별 묶음 */
  .day-group{ margin-bottom:6px; }
  .day-group-head{
    display:flex; align-items:center; gap:7px;
    padding:9px 4px 7px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--surface); z-index:2;
  }
  .day-group-name{ font-weight:700; font-size:.88rem; }
  .day-group-count{
    margin-left:auto; font-size:.72rem; font-weight:700;
    color:var(--accent); background:var(--accent-soft);
    border-radius:999px; padding:1px 9px;
  }
  .day-entry.in-group{ padding-left:19px; }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(30,27,20,.42); display:flex; align-items:flex-end;
    justify-content:center; z-index:50; padding: 0;
  }
  @media (min-width: 640px){ .overlay{ align-items:center; padding:20px; } }
  .overlay-top{ z-index:70; }
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:80;
    max-width:min(92vw, 420px); padding:12px 18px; border-radius:12px;
    background:var(--ink); color:var(--bg); font-size:.88rem; font-weight:600;
    line-height:1.5; text-align:center; box-shadow:var(--shadow);
  }
  /* ---------- 게시판 ---------- */
  .back-link{
    border:none; background:none; padding:0 0 10px; color:var(--ink-soft);
    font-family:inherit; font-size:.86rem; font-weight:700;
  }
  .back-link:hover{ color:var(--ink); }
  .board-list{ display:flex; flex-direction:column; gap:10px; }
  .board-row{ display:flex; align-items:stretch; gap:8px; }
  .board-row .board-card{ flex:1; min-width:0; }
  .board-move{ display:flex; flex-direction:column; gap:4px; justify-content:center; flex:none; }
  .move-btn{
    width:34px; height:30px; border-radius:8px; padding:0; line-height:1;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-soft);
    font-size:.7rem; font-family:inherit;
  }
  .move-btn:hover:not(:disabled){ background:var(--surface-2); color:var(--ink); }
  .move-btn:disabled{ opacity:.35; cursor:default; }
  .board-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 17px;
    display:flex; flex-direction:column; gap:6px; text-align:left; width:100%;
    font-family:inherit; color:var(--ink);
  }
  .board-card:hover{ border-color:var(--line-strong); }
  .board-card.inert{ cursor:default; background:var(--surface-2); }
  .board-card-top{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .board-name{ font-family:'Noto Serif KR',serif; font-weight:700; font-size:1.02rem; }
  .board-meta{ font-size:.8rem; color:var(--ink-soft); }
  .badge-lock{
    font-size:.7rem; font-weight:700; color:var(--ink-soft);
    background:var(--surface-2); border:1px solid var(--line-strong); padding:2px 9px; border-radius:999px;
  }
  .post-list{ display:flex; flex-direction:column; }
  .post-row{
    border:none; border-bottom:1px solid var(--line); background:none; width:100%; text-align:left;
    padding:14px 4px; font-family:inherit; color:var(--ink); display:flex; flex-direction:column; gap:4px;
  }
  .post-row:last-child{ border-bottom:none; }
  .post-row:hover{ background:var(--surface-2); }
  .post-row-title{ font-weight:600; font-size:.96rem; }
  .post-row.pinned{ background:var(--surface-2); }
  .pin-badge{
    display:inline-block; margin-right:7px; font-size:.68rem; font-weight:800; vertical-align:1px;
    color:var(--accent); background:var(--accent-soft); padding:2px 8px; border-radius:999px;
    font-family:'Noto Sans KR',sans-serif;
  }
  .reply-badge{
    display:inline-block; margin-left:7px; font-size:.68rem; font-weight:700; vertical-align:1px;
    color:var(--accent); background:var(--accent-soft); padding:2px 8px; border-radius:999px;
    font-family:'Noto Sans KR',sans-serif; white-space:nowrap;
  }
  .post-row-meta{ font-size:.77rem; color:var(--ink-faint); }
  .post-view{
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px 20px;
  }
  .post-title{ font-size:1.3rem; }
  .post-byline{ font-size:.8rem; color:var(--ink-faint); margin-top:8px; }
  .pending-mark{
    display:inline-block; padding:5px 14px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent);
    font-size:.8rem; font-weight:700;
  }
  .wait-count{
    font-family:'Noto Sans KR',sans-serif; font-size:.78rem; font-weight:700;
    color:var(--accent-ink); background:var(--accent);
    border-radius:999px; padding:1px 9px; margin-left:6px;
  }
  .wait-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .wait-card{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--accent);
    border-radius:12px; padding:12px 14px;
  }
  .wait-card > div:first-child{ flex:1; min-width:0; }
  .wait-name{ font-weight:700; font-size:.92rem; }
  .wait-meta{ font-size:.76rem; color:var(--ink-faint); margin-top:2px; word-break:break-all; }
  .wait-actions{ display:flex; gap:8px; flex:none; }
  .wait-actions .btn{ margin-top:0; width:auto; }

  .two-col{ display:flex; gap:10px; }
  .two-col > .field{ flex:1; min-width:0; }
  .two-col > .field:first-child{ flex:1.3; }
  .three-col{ display:flex; gap:8px; }
  .three-col > .field{ flex:1; min-width:0; }
  .three-col input, .three-col select{ text-align:center; }
  .readout{
    border:1px solid var(--line); border-radius:10px; padding:10px 6px;
    background:var(--accent-soft); color:var(--accent);
    font-weight:700; text-align:center; font-size:.95rem;
  }
  .age-badge{
    display:inline-block; margin-left:6px; font-size:.7rem; font-weight:700;
    padding:1px 7px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent); vertical-align:middle;
  }
  .type-badge{
    font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent); white-space:nowrap;
  }
  .val-link{
    color:var(--accent); text-decoration:underline; text-underline-offset:3px;
    font-weight:600; word-break:break-all;
  }
  .post-body{
    margin-top:18px; padding-top:18px; border-top:1px solid var(--line);
    white-space:pre-wrap; line-height:1.75; font-size:.95rem;
  }

  /* ---- 답글 ---- */
  .comment-wrap{ margin-top:18px; }
  .comment-head{
    font-size:.95rem; margin:0 0 10px; display:flex; align-items:center; gap:7px;
  }
  .comment-count{
    font-family:'Noto Sans KR',sans-serif; font-size:.8rem; font-weight:700;
    color:var(--accent); background:var(--accent-soft);
    border-radius:999px; padding:1px 9px;
  }
  .comment-empty{
    font-size:.85rem; color:var(--ink-faint); margin:0 0 12px;
    background:var(--surface); border:1px dashed var(--line);
    border-radius:12px; padding:16px; text-align:center;
  }
  .comment{
    position:relative; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; margin-bottom:8px;
  }
  .comment-top{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .comment-avatar{
    width:22px; height:22px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-size:.72rem; font-weight:700; font-family:'Noto Serif KR',serif;
    background:var(--accent-soft); color:var(--accent);
  }
  .comment-avatar.me{ background:var(--accent); color:var(--accent-ink); }
  .comment-who{ font-weight:700; font-size:.85rem; }
  .comment-role{
    font-size:.7rem; color:var(--ink-faint);
    border:1px solid var(--line); border-radius:999px; padding:1px 7px;
  }
  .comment-when{ font-size:.72rem; color:var(--ink-faint); margin-left:auto; }
  .comment-body{
    margin-top:8px; white-space:pre-wrap; line-height:1.65; font-size:.88rem;
    padding-right:36px;
  }
  .comment-del{
    position:absolute; right:10px; bottom:10px;
    border:none; background:none; font-family:inherit;
    font-size:.72rem; color:var(--danger); padding:4px 6px; cursor:pointer;
  }
  .comment-form{
    background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:14px; margin-top:12px;
  }
  .comment-as{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .comment-as-name{ font-weight:700; font-size:.85rem; }
  .comment-as-role{ font-size:.72rem; color:var(--ink-faint); }
  .comment-form textarea{
    width:100%; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-family:inherit; font-size:.88rem; line-height:1.6;
    background:var(--bg); color:var(--ink); resize:vertical;
  }
  .comment-form textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .comment-form .btn{ margin-top:10px; }

  /* ---------- 회원(내담자) 관리 ---------- */
  .clients-bar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .clients-bar input{
    flex:1; min-width:150px; padding:11px 13px; border-radius:10px;
    border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); font-size:.95rem;
  }
  .clients-bar input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .client-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:10px; }
  .client-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 15px;
    display:flex; flex-direction:column; gap:8px; text-align:left; width:100%; font-family:inherit; color:var(--ink);
  }
  .client-card:hover{ border-color:var(--line-strong); }
  .client-card-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .client-name{ font-weight:700; font-size:.98rem; }
  .client-meta{ display:flex; flex-wrap:wrap; gap:3px 14px; font-size:.8rem; color:var(--ink-soft); }
  .client-info-btn{
    margin-left:7px; width:19px; height:19px; border-radius:50%; padding:0; line-height:1;
    border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
    font-size:.7rem; font-weight:800; font-family:'Noto Serif KR',serif; vertical-align:1px;
  }
  .memo-box{
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:11px 13px;
    font-size:.87rem; line-height:1.6; white-space:pre-wrap; color:var(--ink);
  }
  .field textarea{
    width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--line-strong);
    background:var(--surface-2); color:var(--ink); font-size:1rem; font-family:inherit; resize:vertical;
  }
  .field textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .cal-chip b{ font-weight:800; }
  .session-badge{
    margin-left:7px; font-size:.7rem; font-weight:700; vertical-align:2px;
    color:var(--accent); background:var(--accent-soft); padding:2px 8px; border-radius:999px;
  }
  .confirm-msg{ margin:0; color:var(--ink-soft); line-height:1.65; white-space:pre-line; }
  .modal{
    background:var(--surface); width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    border-radius: 20px 20px 0 0; box-shadow: var(--shadow); padding: 22px 22px 26px;
  }
  @media (min-width:640px){ .modal{ border-radius:20px; } }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-close{ background:none; border:none; font-size:1.3rem; color:var(--ink-faint); line-height:1; padding:4px; }
  .day-entry{
    display:flex; align-items:flex-start; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line);
  }
  .day-entry:last-child{ border-bottom:none; }
  .day-entry .dot{ margin-top:6px; }
  .day-entry .time{ font-weight:700; font-size:.88rem; white-space:nowrap; }
  .day-entry .title{ font-weight:600; }
  .day-entry .who{ font-size:.78rem; color:var(--ink-soft); }
  .day-entry .memo{ font-size:.82rem; color:var(--ink-soft); margin-top:2px; }
  .day-entry-actions{ margin-left:auto; display:flex; gap:6px; flex:none; }
  .icon-btn{
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px; width:30px; height:30px;
    display:flex; align-items:center; justify-content:center; font-size:.85rem; color:var(--ink-soft); flex:none;
  }
  .empty-note{ color:var(--ink-faint); font-size:.9rem; padding: 14px 4px; }
  .form-row{ display:flex; gap:10px; }

<!-- ============================================================
     Firebase 연결층
     이 블록만 Firebase를 알고, 아래 앱 코드에는 손대지 않아요.
     앱이 쓰던 db.collection(...).doc(...).get() 모양을 그대로
     흉내 내서 window.__mariBackend 로 넘겨줍니다.
     ============================================================ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword,
    createUserWithEmailAndPassword, signOut, sendPasswordResetEmail,
    updatePassword, deleteUser
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
    collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc,
    onSnapshot, query, where, orderBy, limit
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC7aGmjsEwR6xisk1brOXrrbWQc4NeqjZY",
    authDomain: "mari-schedule.firebaseapp.com",
    projectId: "mari-schedule",
    storageBucket: "mari-schedule.firebasestorage.app",
    messagingSenderId: "450301025372",
    appId: "1:450301025372:web:89d14d8483b4b028d51a99"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // 로컬 캐시를 켜두면 두 번째 접속부터는 바뀐 것만 받아와서
    // 무료 사용량을 훨씬 아끼고 화면도 빨리 떠요.
    const fs = initializeFirestore(app, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });

    const seg = (p) => String(p).split('/').filter(Boolean);
    const wrapDoc = (s) => ({
      id: s.id,
      exists: typeof s.exists === 'function' ? s.exists() : !!s.exists,
      data: () => s.data()
    });
    const wrapQuery = (s) => {
      const docs = s.docs.map(wrapDoc);
      return { docs, size: docs.length, empty: docs.length === 0, docChanges: () => [] };
    };

    function makeQuery(collPath, clauses){
      const build = () => query(collection(fs, ...seg(collPath)), ...clauses);
      return {
        where: (f, op, v) => makeQuery(collPath, clauses.concat([where(f, op, v)])),
        orderBy: (f, dir) => makeQuery(collPath, clauses.concat([orderBy(f, dir || 'asc')])),
        limit: (n) => makeQuery(collPath, clauses.concat([limit(n)])),
        get: () => getDocs(build()).then(wrapQuery),
        onSnapshot: (next, err) => onSnapshot(build(), (s) => next(wrapQuery(s)), err)
      };
    }

    function makeDocRef(path){
      const parts = seg(path);
      const ref = doc(fs, ...parts);
      return {
        id: parts[parts.length - 1],
        path,
        get: () => getDoc(ref).then(wrapDoc),
        set: (data) => setDoc(ref, data),
        update: (data) => updateDoc(ref, data),
        delete: () => deleteDoc(ref),
        onSnapshot: (next, err) => onSnapshot(ref, (s) => next(wrapDoc(s)), err),
        collection: (sub) => makeCollRef(path + '/' + sub)
      };
    }

    function makeCollRef(path){
      const q = makeQuery(path, []);
      q.path = path;
      q.doc = (id) => makeDocRef(path + '/' + (id || doc(collection(fs, ...seg(path))).id));
      q.add = (data) => { const r = q.doc(); return r.set(data).then(() => r); };
      return q;
    }

    // 구성원을 관리자가 직접 추가할 때 쓰는 두 번째 인증 창구.
    // 기본 창구로 계정을 만들면 로그인이 새 계정으로 바뀌어 버려요.
    let secondary = null;
    const secondaryAuth = () => {
      if (!secondary) secondary = getAuth(initializeApp(firebaseConfig, 'secondary'));
      return secondary;
    };

    window.__mariBackend = {
      db: { doc: makeDocRef, collection: makeCollRef },
      auth: {
        onChange: (fn) => onAuthStateChanged(auth, (u) => fn(u ? { uid: u.uid, email: u.email } : null)),
        signIn: (email, pw) => signInWithEmailAndPassword(auth, email, pw).then(() => true),
        signUp: (email, pw) => createUserWithEmailAndPassword(auth, email, pw).then((c) => c.user.uid),
        signUpSecondary: (email, pw) => {
          const sa = secondaryAuth();
          return createUserWithEmailAndPassword(sa, email, pw)
            .then((c) => signOut(sa).then(() => c.user.uid));
        },
        signOut: () => signOut(auth),
        sendReset: (email) => sendPasswordResetEmail(auth, email),
        updatePassword: (pw) => updatePassword(auth.currentUser, pw),
        deleteCurrentUser: () => (auth.currentUser ? deleteUser(auth.currentUser) : Promise.resolve())
      }
    };
    window.dispatchEvent(new Event('mari-backend-ready'));
  } catch (e) {
    console.error('Firebase 초기화 실패:', e);
    window.dispatchEvent(new Event('mari-backend-failed'));
  }
</script>


<script>
/* ============================================================
   아주 작은 엑셀(.xlsx) 만들기 — 바깥 라이브러리 없이 동작합니다.
   .xlsx 는 사실 XML 몇 장을 zip 으로 묶은 것뿐이라, 압축 없이(store)
   묶어주면 엑셀·구글시트·넘버스가 모두 그대로 열어요.

   쓰는 법
     MariXlsx.build([{ name:'달력', cols:[22,22,...], rows:[...] }])
     rows:  [{ h:60, cells:[ {v:'글', s:'day', span:2} ] }]
     칸 하나는 v(글자/숫자) 또는 runs([{t,b,sz,color}])
   ============================================================ */
(function(global){
  'use strict';

  /* ---------- zip ---------- */
  var crcTable = (function(){
    var t = new Uint32Array(256);
    for(var n=0;n<256;n++){
      var c = n;
      for(var k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf){
    var c = 0xFFFFFFFF;
    for(var i=0;i<buf.length;i++) c = crcTable[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  var enc = new TextEncoder();

  function zip(files){
    // files: [{name, data:Uint8Array}]
    var parts = [], central = [], offset = 0;
    var now = new Date();
    var dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((now.getSeconds() / 2) & 31);
    var dosDate = (((now.getFullYear() - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);

    files.forEach(function(f){
      var name = enc.encode(f.name);
      var data = f.data;
      var crc = crc32(data);

      var lh = new Uint8Array(30 + name.length);
      var lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);     // 파일명 UTF-8
      lv.setUint16(8, 0, true);          // 압축 안 함
      lv.setUint16(10, dosTime, true);
      lv.setUint16(12, dosDate, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, name.length, true);
      lv.setUint16(28, 0, true);
      lh.set(name, 30);
      parts.push(lh, data);

      var ch = new Uint8Array(46 + name.length);
      var cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true);
      cv.setUint16(14, dosDate, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint32(42, offset, true);
      ch.set(name, 46);
      central.push(ch);

      offset += lh.length + data.length;
    });

    var cdSize = central.reduce(function(a,b){ return a + b.length; }, 0);
    var eocd = new Uint8Array(22);
    var ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    var all = parts.concat(central, [eocd]);
    var total = all.reduce(function(a,b){ return a + b.length; }, 0);
    var out = new Uint8Array(total), p = 0;
    all.forEach(function(chunk){ out.set(chunk, p); p += chunk.length; });
    return out;
  }

  /* ---------- xml ---------- */
  function x(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      // 엑셀이 못 읽는 제어문자는 미리 걷어냅니다
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
  }
  function colName(n){            // 0 -> A
    var s = '';
    n = n + 1;
    while(n > 0){ var r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = ((n - r) / 26) | 0; }
    return s;
  }

  /* ---------- 서식 ----------
     글꼴 / 배경 / 테두리를 미리 정해두고 이름으로 골라 씁니다. */
  var INK = 'FF2E2B26', SOFT = 'FF7A7368', GREEN = 'FF3A5C44', WHITE = 'FFFFFFFF';
  var RED = 'FFC0392B', BLUE = 'FF2C6FBF', GOLD = 'FF8A6A1F';

  var FONTS = [
    { sz:11 },                                   // 0 기본
    { sz:11, b:true },                           // 1 굵게
    { sz:16, b:true, color:GREEN },              // 2 제목
    { sz:9,  color:SOFT },                       // 3 작은 설명
    { sz:11, b:true, color:WHITE },              // 4 머리글(초록 바탕)
    { sz:11, b:true, color:RED },                // 5 일요일 머리글
    { sz:11, b:true, color:BLUE },               // 6 토요일 머리글
    { sz:10, b:true },                           // 7 날짜 숫자
    { sz:10, b:true, color:RED },                // 8 날짜 숫자(일/공휴일)
    { sz:10, b:true, color:BLUE },               // 9 날짜 숫자(토)
    { sz:8,  color:INK },                        // 10 일정 한 줄
    { sz:8,  color:SOFT },                       // 11 일정 보조
    { sz:10, b:true, color:SOFT },               // 12 지난달/다음달 날짜
    { sz:8,  b:true, color:GOLD }                // 13 공휴일 이름
  ];
  var FILLS = [
    null, null,                                  // 0,1 은 규격상 예약
    'FF4F7A5B',                                  // 2 초록 머리글
    'FFF3F0E9',                                  // 3 옅은 크림
    'FFFDECEC',                                  // 4 공휴일
    'FFF7F7F5',                                  // 5 지난달/다음달
    'FFFCF3D6'                                   // 6 직접 입력하는 칸(단가)
  ];
  // borderId 0 = 없음, 1 = 얇은 테두리
  var STYLES = {
    base:     { f:0 },
    title:    { f:2 },
    sub:      { f:3 },
    whead:    { f:4, fill:2, b:1, align:'center', v:'center' },
    wheadSun: { f:4, fill:2, b:1, align:'center', v:'center' },
    wheadSat: { f:4, fill:2, b:1, align:'center', v:'center' },
    day:      { f:10, b:1, align:'left', v:'top', wrap:true },
    daySun:   { f:10, b:1, align:'left', v:'top', wrap:true },
    daySat:   { f:10, b:1, align:'left', v:'top', wrap:true },
    dayHol:   { f:10, fill:4, b:1, align:'left', v:'top', wrap:true },
    dayOut:   { f:10, fill:5, b:1, align:'left', v:'top', wrap:true },
    th:       { f:4, fill:2, b:1, align:'center', v:'center' },
    blockhead:{ f:4, fill:2, b:1, align:'left',   v:'center' },
    dayhead:  { f:1, fill:3, b:1, align:'center', v:'center' },
    dayheadSun:{f:5, fill:3, b:1, align:'center', v:'center' },
    dayheadSat:{f:6, fill:3, b:1, align:'center', v:'center' },
    rowhead:  { f:1, fill:3, b:1, align:'left',   v:'center' },
    sumcell:  { f:1, fill:3, b:1, align:'center', v:'center' },
    priceIn:  { f:0, fill:6, b:1, align:'right',  v:'center', numFmt:164 },
    priceRef: { f:0, b:1, align:'right', v:'center', numFmt:164 },
    money:    { f:1, b:1, align:'right', v:'center', numFmt:164 },
    moneySum: { f:1, fill:3, b:1, align:'right', v:'center', numFmt:164 },
    td:       { f:0, b:1, align:'left', v:'center', wrap:true },
    tdC:      { f:0, b:1, align:'center', v:'center' },
    tdHead:   { f:1, fill:3, b:1, align:'left', v:'center' }
  };
  var STYLE_ORDER = Object.keys(STYLES);

  function fontXml(f){
    return '<font><sz val="'+f.sz+'"/>'
      + (f.b ? '<b/>' : '')
      + '<color rgb="'+(f.color || INK)+'"/>'
      + '<name val="맑은 고딕"/><family val="2"/></font>';
  }
  function stylesXml(){
    var s = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    s += '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
    s += '<numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts>';
    s += '<fonts count="'+FONTS.length+'">' + FONTS.map(fontXml).join('') + '</fonts>';
    s += '<fills count="'+FILLS.length+'">';
    s += '<fill><patternFill patternType="none"/></fill>';
    s += '<fill><patternFill patternType="gray125"/></fill>';
    for(var i=2;i<FILLS.length;i++){
      s += '<fill><patternFill patternType="solid"><fgColor rgb="'+FILLS[i]+'"/><bgColor indexed="64"/></patternFill></fill>';
    }
    s += '</fills>';
    s += '<borders count="2">';
    s += '<border><left/><right/><top/><bottom/><diagonal/></border>';
    s += '<border>'
       + '<left style="thin"><color rgb="FFD9D3C7"/></left>'
       + '<right style="thin"><color rgb="FFD9D3C7"/></right>'
       + '<top style="thin"><color rgb="FFD9D3C7"/></top>'
       + '<bottom style="thin"><color rgb="FFD9D3C7"/></bottom>'
       + '<diagonal/></border>';
    s += '</borders>';
    s += '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>';
    s += '<cellXfs count="'+STYLE_ORDER.length+'">';
    STYLE_ORDER.forEach(function(k){
      var d = STYLES[k];
      var al = '';
      if(d.align || d.v || d.wrap){
        al = '<alignment'
           + (d.align ? ' horizontal="'+d.align+'"' : '')
           + (d.v ? ' vertical="'+d.v+'"' : '')
           + (d.wrap ? ' wrapText="1"' : '')
           + '/>';
      }
      s += '<xf numFmtId="'+(d.numFmt||0)+'" fontId="'+(d.f||0)+'" fillId="'+(d.fill||0)+'" borderId="'+(d.b||0)+'" xfId="0"'
         + ' applyFont="1"' + (d.numFmt ? ' applyNumberFormat="1"' : '')
         + (d.fill ? ' applyFill="1"' : '') + (d.b ? ' applyBorder="1"' : '')
         + (al ? ' applyAlignment="1">'+al+'</xf>' : '/>');
    });
    s += '</cellXfs>';
    s += '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>';
    s += '</styleSheet>';

  function styleIndex(name){
    var i = STYLE_ORDER.indexOf(name);
    return i === -1 ? 0 : i;
  }

  /* ---------- 시트 ---------- */
  function runXml(r){
    // 주의: 칸 안의 부분 서식(rPr)은 글꼴 이름을 <name> 이 아니라 <rFont> 로 씁니다.
    var pr = '<rPr>'
      + '<rFont val="맑은 고딕"/><family val="2"/>'
      + (r.b ? '<b/>' : '')
      + '<color rgb="'+(r.color || INK)+'"/>'
      + '<sz val="'+(r.sz || 10)+'"/>'
      + '</rPr>';
    return '<r>'+pr+'<t xml:space="preserve">'+x(r.t)+'</t></r>';
  }
  function sheetXml(sheet){
    var merges = [];
    var s = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    s += '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
    // 인쇄할 때 가로로 잘리지 않게 (한 장 너비에 맞춤)
    s += '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>';
    s += '<sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews>';
    s += '<sheetFormatPr defaultRowHeight="15"/>';
    if(sheet.cols && sheet.cols.length){
      s += '<cols>';
      sheet.cols.forEach(function(w, i){
        s += '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>';
      });
      s += '</cols>';
    }
    s += '<sheetData>';
    (sheet.rows || []).forEach(function(row, ri){
      var r = ri + 1;
      s += '<row r="'+r+'"' + (row.h ? ' ht="'+row.h+'" customHeight="1"' : '') + '>';
      var ci = 0;
      (row.cells || []).forEach(function(cell){
        if(cell == null){ ci++; return; }
        var span = cell.span || 1;
        var ref = colName(ci) + r;
        var st = ' s="'+styleIndex(cell.s || 'base')+'"';
        if(cell.f){
          // 수식 칸 — 값을 미리 넣지 않고 엑셀이 직접 계산하게 둡니다
          s += '<c r="'+ref+'"'+st+'><f>'+x(cell.f)+'</f></c>';
        } else if(cell.runs && cell.runs.length){
          s += '<c r="'+ref+'"'+st+' t="inlineStr"><is>' + cell.runs.map(runXml).join('') + '</is></c>';
        } else if(typeof cell.v === 'number'){
          s += '<c r="'+ref+'"'+st+'><v>'+cell.v+'</v></c>';
        } else {
          s += '<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+x(cell.v)+'</t></is></c>';
        }
        // 합쳐진 칸의 나머지도 서식이 이어져야 테두리가 끊기지 않아요
        for(var k=1;k<span;k++){
          s += '<c r="'+colName(ci+k)+r+'"'+st+'/>';
        }
        if(span > 1) merges.push(ref + ':' + colName(ci + span - 1) + r);
        ci += span;
      });
      s += '</row>';
    });
    s += '</sheetData>';
    if(merges.length){
      s += '<mergeCells count="'+merges.length+'">'
         + merges.map(function(m){ return '<mergeCell ref="'+m+'"/>'; }).join('')
         + '</mergeCells>';
    }
    s += '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>';
    s += '<pageSetup paperSize="9" orientation="'+(sheet.landscape ? 'landscape' : 'portrait')+'" fitToWidth="1" fitToHeight="0"/>';
    s += '</worksheet>';
    return s;
  }

  function build(sheets){
    var files = [];
    var n = sheets.length;

    var ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>';
    for(var i=0;i<n;i++){
      ct += '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    }
    ct += '</Types>';
    files.push({ name:'[Content_Types].xml', data:enc.encode(ct) });

    files.push({ name:'_rels/.rels', data:enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
      + '</Relationships>') });

    var wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"'
      + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
    sheets.forEach(function(sh, i){
      wb += '<sheet name="'+x(sh.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';
    });
    wb += '</sheets>';
    wb += '<calcPr calcId="191029" fullCalcOnLoad="1"/>';
    wb += '</workbook>';
    files.push({ name:'xl/workbook.xml', data:enc.encode(wb) });

    var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
    sheets.forEach(function(sh, i){
      rels += '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';
    });
    rels += '<Relationship Id="rId'+(n+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
    rels += '</Relationships>';
    files.push({ name:'xl/_rels/workbook.xml.rels', data:enc.encode(rels) });

    files.push({ name:'xl/styles.xml', data:enc.encode(stylesXml()) });
    sheets.forEach(function(sh, i){
      files.push({ name:'xl/worksheets/sheet'+(i+1)+'.xml', data:enc.encode(sheetXml(sh)) });
    });

    return zip(files);
  }

    clientTypes: {},          // clientId -> '일반' / '바우처01' ...

  var today = new Date();
  state.view.year = today.getFullYear();
  state.view.month = today.getMonth();

  function pad2(n){ return n < 10 ? '0'+n : ''+n; }
  function fmtDate(y,m,d){ return y+'-'+pad2(m+1)+'-'+pad2(d); }
  function todayStr(){ return fmtDate(today.getFullYear(), today.getMonth(), today.getDate()); }
  function fmtDateOnly(iso){ return iso ? String(iso).slice(0,10) : '-'; }

  // 이메일·전화번호를 눌러서 바로 메일 앱 / 전화 앱으로 넘어가게 합니다.
  //
  // 기기에 따라 가는 곳이 달라요.
  //  - 휴대폰·태블릿: mailto → 지메일 같은 기본 메일 앱이 열립니다.
  //  - 컴퓨터: 지메일 웹 쓰기 화면을 새 탭으로 엽니다. 컴퓨터에는 메일
  //    프로그램이 없는 경우가 많아서, mailto 로는 눌러도 아무 일이 안 일어나거든요.
  var IS_TOUCH = (function(){
    try { return window.matchMedia('(pointer: coarse)').matches; } catch(e){ return false; }
  })();
  function mailLink(addr){
    var v = String(addr||'').trim();
    if(!v) return '-';
    if(IS_TOUCH){
      return '<a class="val-link" href="mailto:' + esc(v) + '">' + esc(v) + '</a>';
    }
    var gmail = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(v);
    return '<a class="val-link" href="' + esc(gmail) + '" target="_blank" rel="noopener">' + esc(v) + '</a>';
  }
  function telLink(num){
    var v = String(num||'').trim();
    if(!v) return '-';
    var digits = v.replace(/[^0-9+]/g, '');
    if(!digits) return esc(v);
    return '<a class="val-link" href="tel:' + esc(digits) + '">' + esc(v) + '</a>';
  }
  function normEmail(s){ return (s||'').trim().toLowerCase(); }
  // 관리자 이메일 -> 조직을 찾는 작은 열쇠 문서의 id.
  // 계정 목록 전체를 뒤지지 않아도 되게 하려고 따로 둡니다.
  function orgKeyOf(email){
    return normEmail(email).replace(/[^a-z0-9@._+-]/g, '_').slice(0, 180);
  }
  // 관리자는 늘 승인된 상태. 예전에 가입한 구성원(승인 항목이 아예 없는 계정)도
  // 승인된 것으로 봅니다 — 이 기능을 켠다고 쓰던 분들이 막히면 안 되니까요.
  function isApproved(acct){
    if(!acct) return false;
    return acct.role === 'admin' || acct.approved !== false;
  }
  function normPhone(s){ return (s||'').replace(/\D/g,''); }

  function loadColorMode(){
    try{
      return localStorage.getItem(COLORMODE_KEY) === 'person' ? 'person' : 'job';
    }catch(e){ return 'job'; }
  }
  function saveColorMode(m){
    try{ localStorage.setItem(COLORMODE_KEY, m); }catch(e){ /* ignore */ }
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // Firebase 인증이 돌려주는 오류 코드를 사람이 읽을 말로.
  function authMessage(err, fallback){
    var code = (err && err.code) || '';
    if(code.indexOf('invalid-credential') !== -1 ||
       code.indexOf('wrong-password') !== -1 ||
       code.indexOf('user-not-found') !== -1) return '이메일 또는 비밀번호가 올바르지 않아요.';
    if(code.indexOf('invalid-email') !== -1) return '이메일 주소 형식이 올바르지 않아요.';
    if(code.indexOf('email-already-in-use') !== -1) return '이미 가입된 이메일이에요. 로그인해주세요.';
    if(code.indexOf('weak-password') !== -1) return '비밀번호는 '+MIN_PW+'자 이상이어야 해요.';
    if(code.indexOf('too-many-requests') !== -1) return '시도가 너무 많아 잠시 막혔어요. 잠시 뒤에 다시 해주세요.';
    if(code.indexOf('network') !== -1) return '네트워크 연결을 확인해주세요.';
    if(code.indexOf('requires-recent-login') !== -1) return '보안을 위해 다시 로그인한 뒤 변경해주세요.';
    if(code.indexOf('user-disabled') !== -1) return '사용이 중지된 계정이에요. 관리자에게 문의해주세요.';
    return fallback || '처리에 실패했어요. 다시 시도해주세요.';
  }

  /* ---------------- boot / session lifecycle ---------------- */
  var accountUnsub = null;
  var orgUnsubs = [];

  function clearOrgSubs(){
    orgUnsubs.forEach(function(u){ try{ u(); }catch(e){} });
    orgUnsubs = [];
    state.orgIdSubscribed = null;
    state.members = [];
    state.entries = [];
    state.clients = [];
    state.clientTypes = {};
    clearTypeSub();
    state.boards = [];
    state.posts = [];
    state.comments = [];
    state.orgAdmin = null;
  }
  function clearAccountSub(){
    if(accountUnsub){ try{ accountUnsub(); }catch(e){} accountUnsub = null; }
  }

  // 회원가입 중에는 인증 상태가 먼저 바뀌는데 계정 문서는 아직 없어요.
  // 그 사이에 리스너가 붙으면 "계정 없음"으로 판단해 로그아웃시켜 버리니,
  // 문서를 다 만든 뒤에 직접 붙이도록 잠깐 막아둡니다.
  var signupInProgress = false;

  function boot(){
    var settled = false;
    var start = function(backend){
      if(settled) return;
      settled = true;
      if(!backend){ state.dbReady = false; render(); return; }
      state.db = backend.db;
      state.auth = backend.auth;
      state.dbReady = true;

      backend.auth.onChange(function(user){
        if(signupInProgress) return;
        if(user){
          state.session = { accountId: user.uid };
          attachAccountListener(user.uid);
        } else {
          state.session = null;
          state.account = null;
          clearAccountSub(); clearOrgSubs();
          render();
        }
      });
      render();
    };

    if(window.__mariBackend){ start(window.__mariBackend); }
    else {
      window.addEventListener('mari-backend-ready', function(){ start(window.__mariBackend); });
      window.addEventListener('mari-backend-failed', function(){ start(null); });
    }
    // 연결이 아예 응답하지 않을 때 "불러오는 중"에 갇히지 않도록.
    setTimeout(function(){ if(!settled){ start(null); } }, 12000);
    render();
  }

  function attachAccountListener(accountId){
    clearAccountSub(); clearOrgSubs();
    state.account = undefined;
    var delivered = false;

    var handleSnap = function(snap){
      delivered = true;
      if(!snap.exists){
        // 계정 문서가 사라졌다 = 완전 삭제된 구성원. 로그인 자체를 끊어요.
        state.account = null;
        clearOrgSubs();
        logout();
        return;
      }
      var acct = Object.assign({}, snap.data()); acct.id = snap.id;
      if(acct.role === 'member' && acct.active === false){
        // withdrawn while active elsewhere: kick out immediately
        state.account = null;
        clearAccountSub(); clearOrgSubs();
        state.authNotice = '탈퇴 처리된 계정이에요. 관리자에게 문의해주세요.';
        logout();
        return;
      }
      state.account = acct;
      ensureOrgSubs(acct);
      // 권한(manageSchedule)이 바뀌면 바로 반영되도록 따로 확인합니다
      ensureTypeSub(acct);
      if(acct.role === 'admin' && acct.orgEmailKey !== orgKeyOf(acct.email)) ensureOrgKey(acct);
      render();
    };

    accountUnsub = state.db.doc('accounts/'+accountId).onSnapshot(handleSnap, function(){
      delivered = true;
      state.account = null; render();
    });

    // Safety net: a live subscription should deliver its first snapshot
    // "soon after registration", but right after this account was just
    // created (a signup or admin-added member), fall back to a one-time
    // read so nobody gets stuck on the loading screen if that first
    // delivery is ever slow or missed.
    setTimeout(function(){
      if(delivered) return;
      if(!state.session || state.session.accountId !== accountId) return;
      if(state.account !== undefined) return;
      state.db.doc('accounts/'+accountId).get().then(function(snap){
        if(!delivered && state.session && state.session.accountId === accountId && state.account === undefined){
          handleSnap(snap);
        }
      }).catch(function(){});
    }, 4000);
  }

  // 가입 직후처럼 계정 문서를 막 만든 뒤 직접 붙일 때 씁니다.
  function loginWithAccountId(accountId){
    signupInProgress = false;
    state.session = { accountId: accountId };
    attachAccountListener(accountId);
    render();
  }

  function logout(){
    clearAccountSub(); clearOrgSubs();
    state.session = null; state.account = null;
    state.panel = 'calendar'; state.menuOpen = false;
    state.boardId = null; state.postId = null; state.clientFilter = null;
    // 로그아웃하면 항상 로그인 탭으로 — 가입 탭에 머물러 있으면 헷갈려요.
    state.authMode = 'login';
    state.loginError = ''; state.signupError = '';
    if(state.auth){ state.auth.signOut().catch(function(){}); }
    render();
  }

  function ensureOrgSubs(acct){
    var orgId = acct.role === 'admin' ? acct.id : acct.orgId;
    if(!orgId) return;
    // 승인 대기 중에는 달력·내담자·게시판을 불러오지 않아요.
    if(!isApproved(acct)){ clearOrgSubs(); attachAdminOnly(acct, orgId); return; }
    if(state.orgIdSubscribed === orgId) return;
    clearOrgSubs();
    state.orgIdSubscribed = orgId;
    var db = state.db;

    if(acct.role === 'admin'){
      state.orgAdmin = acct;
    } else {
      var u1 = db.doc('accounts/'+orgId).onSnapshot(function(snap){
        state.orgAdmin = snap.exists ? Object.assign({id:snap.id}, snap.data()) : null;
        render();
      });
      orgUnsubs.push(u1);
    }

    // 정렬은 여기서 직접 합니다.
    // Firestore 는 where + orderBy 를 다른 필드로 걸면 "복합 색인"을 먼저
    // 만들어야 하고, 없으면 failed-precondition 으로 아예 아무것도 못 읽어요.
    // 건수가 많지 않아서 받아온 뒤 정렬하는 편이 훨씬 안전합니다.
    function rows(qs, field){
      var out = qs.docs.map(function(d){ var v=Object.assign({}, d.data()); v.id=d.id; return v; });
      out.sort(function(a,b){
        var av=a[field], bv=b[field];
        if(typeof av === 'number' || typeof bv === 'number'){
          return (av==null?1e9:av) - (bv==null?1e9:bv);
        }
        av = av==null ? '' : String(av);
        bv = bv==null ? '' : String(bv);
        return av.localeCompare(bv, 'ko');
      });
      return out;
    }

    var u2 = db.collection('accounts').where('orgId','==',orgId).limit(500).onSnapshot(function(qs){
      state.members = rows(qs, 'order');
      render();
    }, function(){ /* leave last-known members in place; the store retries internally */ });
    orgUnsubs.push(u2);

    // 일정은 지워지지 않고 계속 쌓입니다. 건수 제한을 걸지 않아요.
    // (아주 큰 limit 값은 서버가 invalid-argument 로 거절합니다. 그래서
    //  아예 걸지 않고, 혹시 실패하면 1000건으로 한 번 더 시도해요.)
    // 처음 한 번만 전부 받아오고, 그다음부터는 바뀐 것만 주고받습니다.
    var subscribeSchedule = function(limitN){
      var q = db.collection('schedule').where('orgId','==',orgId);
      if(limitN) q = q.limit(limitN);
      return q.onSnapshot(function(qs){
        state.entriesError = '';
        state.entries = rows(qs, 'date');
        render();
      }, function(err){
        var code = (err && err.code) || 'unavailable';
        // 한 번은 건수를 줄여 다시 시도합니다 — 달력이 빈 채로 남지 않게.
        if(!limitN){
          orgUnsubs.push(subscribeSchedule(1000));
          return;
        }
        // 여기까지 오면 진짜 못 읽는 상태예요. "저장이 안 된 것"처럼
        // 보이지 않도록 화면에 사유를 띄웁니다.
        state.entriesError = code;
        render();
      });
    };
    orgUnsubs.push(subscribeSchedule(null));

    var u4 = db.collection('clients').where('orgId','==',orgId).limit(1000).onSnapshot(function(qs){
      state.clientsError = '';
      state.clients = rows(qs, 'name');
      render();
    }, function(err){
      // 조용히 빈 목록을 보여주면 "등록이 안 된 것"처럼 보여요. 이유를 띄웁니다.
      state.clientsError = (err && err.code) || 'unavailable';
      render();
    });
    orgUnsubs.push(u4);

    var u5 = db.collection('boards').where('orgId','==',orgId).limit(200).onSnapshot(function(qs){
      state.boards = rows(qs, 'createdAt');
      render();
    }, function(){ /* 게시판 목록만 비어 보임 */ });
    orgUnsubs.push(u5);

    var u6 = db.collection('posts').where('orgId','==',orgId).limit(1000).onSnapshot(function(qs){
      state.posts = rows(qs, 'createdAt');
      render();
    }, function(){ /* 글 목록만 비어 보임 */ });
    orgUnsubs.push(u6);

    var u7 = db.collection('comments').where('orgId','==',orgId).limit(1000).onSnapshot(function(qs){
      state.comments = rows(qs, 'createdAt');
      render();
    }, function(){ /* 답글만 비어 보임 */ });
    orgUnsubs.push(u7);
  }

  // 상담타입은 권한자만 읽을 수 있습니다. 권한이 없는 구성원은 아예 구독하지
  // 않아요 — 규칙에서도 막히지만, 애초에 요청조차 보내지 않습니다.
  // 관리자가 도중에 권한을 주면 키가 바뀌어서 자동으로 다시 붙어요.
  var typeUnsub = null;
  function clearTypeSub(){
    if(typeUnsub){ try{ typeUnsub(); }catch(e){} typeUnsub = null; }
    state.typeSubKey = null;
  }
  // 승인 대기 화면에도 센터 이름은 보여주고 싶어서, 관리자 문서만 따로 읽어둡니다.
  function attachAdminOnly(acct, orgId){
    if(state.orgIdSubscribed === 'pending:'+orgId) return;
    state.orgIdSubscribed = 'pending:'+orgId;
    var u = state.db.doc('accounts/'+orgId).onSnapshot(function(snap){
      state.orgAdmin = snap.exists ? Object.assign({id:snap.id}, snap.data()) : null;
      render();
    }, function(){});
    orgUnsubs.push(u);
  }

  // 관리자 이메일 -> 조직 열쇠 문서를 항상 최신으로 맞춰둡니다.
  // 예전에 가입한 관리자에게도 로그인할 때 자동으로 만들어져요.
  function ensureOrgKey(acct){
    if(!state.db || !acct || acct.role === 'member') return Promise.resolve();
    var key = orgKeyOf(acct.email);
    if(!key) return Promise.resolve();
    var db = state.db;
    var old = acct.orgEmailKey;
    var chain = (old && old !== key)
      ? db.doc('orgkeys/'+old).delete().catch(function(){})
      : Promise.resolve();
    return chain.then(function(){
      return db.doc('orgkeys/'+key).set({ orgId:acct.id, orgName:acct.orgName || '' });
    }).then(function(){
      if(old === key) return;
      return db.doc('accounts/'+acct.id).update({ orgEmailKey:key });
    }).catch(function(){});
  }

  function ensureTypeSub(acct){
    var orgId = acct.role === 'admin' ? acct.id : acct.orgId;
    var allowed = acct.role === 'admin' || acct.manageSchedule === true;
    var key = orgId + ':' + (allowed ? 'y' : 'n');
    if(state.typeSubKey === key) return;
    clearTypeSub();
    state.typeSubKey = key;
    state.clientTypes = {};
    if(!allowed || !orgId || !state.db) { render(); return; }
    typeUnsub = state.db.collection('clienttypes').where('orgId','==',orgId).limit(1000)
      .onSnapshot(function(qs){
        var map = {};
        qs.docs.forEach(function(d){
          var v = d.data();
          if(v && v.type) map[d.id] = v.type;
        });
        state.clientTypes = map;
        render();
      }, function(){ /* 못 읽으면 타입만 안 보일 뿐 나머지는 그대로 */ });
  }
  // 만 나이. 생일이 아직 안 지났으면 한 살 빼요. 돌 전이면 개월 수로.
  function ageText(birth){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(birth||''));
    if(!m) return '';
    var by = +m[1], bm = +m[2], bd = +m[3];
    var now = new Date();
    var ny = now.getFullYear(), nm = now.getMonth()+1, nd = now.getDate();
    var years = ny - by;
    if(nm < bm || (nm === bm && nd < bd)) years--;
    if(years < 0) return '';
    if(years >= 1) return '만 ' + years + '세';
    var months = (ny - by) * 12 + (nm - bm);
    if(nd < bd) months--;
    if(months < 0) months = 0;
    return months + '개월';

  function genderText(c){ return (c && c.gender) || ''; }

  function orgJobList(){

  function visibleEntries(){

  /* ---------------- 시간 / 반복 helpers ---------------- */
  var DURATIONS = [10,20,30,40,45,50,60,70,80,90,100,110,120];

  function hmToMin(s){

  // Walk forward from the start date, collecting `count` dates that fall on

  function repeatDates(startDate, dows, count){

  function nameKey(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }

  function clientById(id){

  function clientByName(name){

  var NAV_LEVELS = [

    { on:function(){ return !!state.postId; },    off:function(){ state.postId = null; } },

    { on:function(){ return !!state.postEdit; },  off:function(){ state.postEdit = null; } },

  /* ---------------- templates: loading / unavailable ---------------- */

  function tplSignupPane(){

  function bindAuth(){
    document.querySelectorAll('[data-mode]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.authMode = btn.getAttribute('data-mode');
        state.loginError=''; state.signupError='';
        render();
      });
    });
    if(state.authMode==='signup'){ bindSignup(); } else { bindLoginPane(); }
  }

  function bindLoginPane(){
    var resetBtn = document.getElementById('login-reset');
    if(resetBtn) resetBtn.addEventListener('click', function(){
      var email = normEmail(document.getElementById('li-email').value);
      if(!email){ state.loginError='먼저 이메일을 입력한 뒤 눌러주세요.'; render(); return; }
      state.resetBusy = true; state.loginError=''; state.resetMsg=''; render();
      state.auth.sendReset(email).then(function(){
        state.resetBusy = false;
        // 가입되지 않은 주소인지 알려주면 계정 존재 여부가 새어나가니 똑같이 답해요.
        state.resetMsg = esc(email)+' 로 비밀번호 재설정 메일을 보냈어요. 메일함을 확인해주세요.';
        render();
      }).catch(function(err){
        state.resetBusy = false;
        state.loginError = authMessage(err, '메일을 보내지 못했어요. 주소를 확인해주세요.');
        render();
      });
    });

    var submitBtn = document.getElementById('login-submit');
    if(!submitBtn) return;
    submitBtn.addEventListener('click', function(){
      var email = normEmail(document.getElementById('li-email').value);
      var password = document.getElementById('li-password').value;
      if(!email){ state.loginError='이메일을 입력해주세요.'; render(); return; }
      if(!password){ state.loginError='비밀번호를 입력해주세요.'; render(); return; }
      state.loginBusy = true; state.loginError=''; state.resetMsg=''; state.authNotice=''; render();

      // 로그인에 성공하면 인증 상태 변화가 알아서 계정을 붙여줘요.
      state.auth.signIn(email, password).then(function(){
        state.loginBusy = false;
        render();
      }).catch(function(err){
        state.loginBusy = false;
        state.loginError = authMessage(err, '로그인에 실패했어요. 다시 시도해주세요.');
        render();
      });
    });
  }

  function bindSignup(){
    var chk = document.getElementById('su-isadmin');
    if(chk) chk.addEventListener('change', function(){ state.signupIsAdmin = chk.checked; render(); });

    var submitBtn = document.getElementById('signup-submit');
    if(!submitBtn) return;
    submitBtn.addEventListener('click', function(){
      var errEl = function(msg){ state.signupError = msg; state.signupBusy=false; render(); };
      var name = document.getElementById('su-name').value.trim();
      var email = document.getElementById('su-email').value.trim();
      var emailLower = normEmail(email);
      var phone = document.getElementById('su-phone').value.trim();
      var password = document.getElementById('su-password').value;
      var password2 = document.getElementById('su-password2').value;
      var wantsAdmin = state.signupIsAdmin;

      if(!name){ return errEl('이름을 입력해주세요.'); }
      if(!emailLower || emailLower.indexOf('@')<0){ return errEl('올바른 이메일 주소를 입력해주세요.'); }
      if(password.length < MIN_PW){ return errEl('비밀번호는 '+MIN_PW+'자 이상이어야 해요.'); }
      if(password !== password2){ return errEl('비밀번호가 일치하지 않아요.'); }

      var orgName = '';
      var adminEmailInput = '';
      if(wantsAdmin){
        orgName = document.getElementById('su-orgname').value.trim();
        if(!orgName){ return errEl('센터 이름을 입력해주세요.'); }
      } else {
        adminEmailInput = normEmail(document.getElementById('su-adminemail').value);
        if(!adminEmailInput){ return errEl('관리자 이메일을 입력해주세요.'); }
      }

      state.signupBusy = true; state.signupError=''; render();
      var db = state.db;

      // 인증 계정을 먼저 만들어요. 로그인된 상태가 되어야 조직을 조회할 수
      // 있고, 계정 문서 id를 인증 uid와 맞춰야 보안 규칙이 본인을 알아봐요.
      // 그 사이 인증 변화가 리스너를 붙이지 못하도록 잠가둡니다.
      signupInProgress = true;
      var uid = null;

      state.auth.signUp(emailLower, password).then(function(newUid){
        uid = newUid;
        if(wantsAdmin){
          var myKey = orgKeyOf(emailLower);
          return db.doc('accounts/'+uid).set({
            role:'admin', name:name, email:email, emailLower:emailLower, phone:phone,
            orgName:orgName, orgEmailKey:myKey, createdAt:new Date().toISOString()
          }).then(function(){
            // 구성원이 "관리자 이메일"로 우리 센터를 찾을 때 쓰는 열쇠 문서
            return db.doc('orgkeys/'+myKey).set({ orgId:uid, orgName:orgName });
          });
        }
        return db.doc('orgkeys/'+orgKeyOf(adminEmailInput)).get().then(function(snap){
          if(!snap.exists) throw {code:'no-admin'};
          return Object.assign({}, snap.data()).orgId;
        }).then(function(orgId){
          if(!orgId) throw {code:'no-admin'};
          // 아직 내 계정 문서가 없어서 다른 계정은 못 읽어요.
          // 순서는 가입 시각으로, 색은 uid 로 정합니다.
          var seed = 0;
          for(var si=0; si<uid.length; si++) seed += uid.charCodeAt(si);
          return db.doc('accounts/'+uid).set({
            role:'member', name:name, email:email, emailLower:emailLower, phone:phone,
            orgId:orgId, position:'', job:'', duties:'', manageSchedule:false, active:true,
            approved:false,          // 관리자가 승인해야 들어올 수 있어요
            order: Date.now(), colorIndex: seed % TAG_COUNT,
            joinedAt:new Date().toISOString()
          });
        });
      }).then(function(){
        state.signupBusy = false;
        loginWithAccountId(uid);
      }).catch(function(err){
        signupInProgress = false;
        var code = err && err.code;
        // 관리자 이메일이 틀렸다면 방금 만든 인증 계정은 쓸모가 없으니 지워요.
        // 안 그러면 그 이메일로 다시 가입할 수 없게 됩니다.
        var cleanup = (uid && code === 'no-admin')
          ? state.auth.deleteCurrentUser().catch(function(){})
          : Promise.resolve();
        cleanup.then(function(){
          errEl(
            code==='no-admin' ? '해당 이메일의 관리자를 찾을 수 없어요. 이메일을 다시 확인해주세요.'
              : authMessage(err, '가입에 실패했어요. 다시 시도해주세요.')
          );
        });
      });
    });
  }

  /* ---------------- 확인창 ---------------- */
  // window.confirm() is blocked inside the artifact's sandboxed frame — it
  // returns false without ever showing anything, which silently swallowed
  // every delete. Everything destructive goes through this in-app dialog.
  function askConfirm(opts){
    state.confirmBox = {
      title: opts.title || '확인',
      message: opts.message || '',
      okLabel: opts.okLabel || '삭제',
      danger: opts.danger !== false,
      onOk: opts.onOk
    };
    render();
  }

  function tplConfirm(){
    var c = state.confirmBox;
    if(!c) return '';
    var html = '<div class="overlay overlay-top" id="confirm-overlay"><div class="modal" style="max-width:380px;">';
    html += '<div class="modal-head"><h3>'+esc(c.title)+'</h3><button class="modal-close" id="confirm-close">&times;</button></div>';
    html += '<p class="confirm-msg">'+esc(c.message)+'</p>';
    html += '<div class="modal-actions">';
    html += '<button class="btn btn-line btn-grow" id="confirm-cancel">취소</button>';
    html += '<button class="btn '+(c.danger?'btn-danger':'btn-primary')+'" id="confirm-ok">'+esc(c.okLabel)+'</button>';
    html += '</div></div></div>';
    return html;
  }

  function bindConfirm(){
    var overlay = document.getElementById('confirm-overlay');
    if(!overlay) return;
    var box = state.confirmBox;
    var close = function(){ state.confirmBox = null; render(); };
    overlay.addEventListener('click', function(ev){ if(ev.target===overlay) close(); });
    ['confirm-close','confirm-cancel'].forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.addEventListener('click', close);
    });
    var ok = document.getElementById('confirm-ok');
    if(ok) ok.addEventListener('click', function(){
      state.confirmBox = null;
      render();
      if(box && box.onOk) box.onOk();
    });
  }

  function tplSummary(){
    var y = state.view.year, m = state.view.month;
    var prefix = y+'-'+pad2(m+1);
    var t = todayStr();
    var inMonth = visibleEntries().filter(function(e){ return (e.date||'').indexOf(prefix)===0; });
    var todays = inMonth.filter(function(e){ return e.date === t; }).length;
    // "예정"도 보고 있는 달 안에서만 셉니다. 지난 달을 보면 0이 돼요.
    var upcoming = inMonth.filter(function(e){ return e.date >= t; }).length;

    var html = '<div class="summary-strip">';
    html += '<span class="summary-item"><b>'+inMonth.length+'</b> 이번 달</span>';
    html += '<span class="summary-item"><b>'+todays+'</b> 오늘</span>';
    html += '<span class="summary-item"><b>'+upcoming+'</b> 예정</span>';
    html += '</div>';
    return html;
  }

  function tplCalendar(y, m){
    var firstDow = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m+1, 0).getDate();
    var daysInPrev = new Date(y, m, 0).getDate();
    var cells = [];
    for(var i=0;i<firstDow;i++){
      var pd = daysInPrev - firstDow + 1 + i;
      cells.push({ day: pd, out:true, dateStr: null });
    }
    for(var d=1; d<=daysInMonth; d++){
      cells.push({ day:d, out:false, dateStr: fmtDate(y,m,d) });
    }
    while(cells.length % 7 !== 0 || cells.length < 42){
      var nd = cells.length - (firstDow + daysInMonth) + 1;
      cells.push({ day: nd, out:true, dateStr:null });
      if(cells.length>=42) break;
    }

    var html = '<div class="cal-grid">';
    DOW.forEach(function(d, i){
      html += '<div class="cal-dow'+(i===0?' sun':(i===6?' sat':''))+'">'+d+'</div>';
    });
    var tStr = todayStr();
    cells.forEach(function(c, i){
      var dow = i % 7;
      if(c.out){
        html += '<div class="cal-cell out"><span class="cal-daynum">'+c.day+'</span></div>';
        return;
      }
      var isToday = c.dateStr === tStr;
      var hol = holidayOf(c.dateStr);
      var dayEntries = entriesOnDate(c.dateStr);
      var cls = 'cal-cell';
      if(isToday) cls += ' today';
      if(hol || dow === 0) cls += ' sun';        // 공휴일과 일요일은 빨강
      else if(dow === 6) cls += ' sat';
      html += '<button class="'+cls+'" data-day="'+c.dateStr+'">';
      html += '<span class="cal-daynum">'+c.day+'</span>';
      if(hol) html += '<span class="cal-holiday">'+esc(hol)+'</span>';
      html += '<span class="cal-entries">';
      if(dayEntries.length <= NAME_CHIP_MAX){
        // 한산한 날은 누가 오는지 한 줄씩 — 이름 + 회차(동그라미 숫자)
        dayEntries.forEach(function(e){
          var idx = colorIndexFor(memberById(e.counselorId));
          var sn = sessionOf(e);
          html += '<span class="cal-chip" style="--tag:var(--tag-'+idx+');--tag-soft:var(--tag-'+idx+'-soft)">' +

      });

  // A dropdown of hours (00–23) or minutes in 5-minute steps — deliberately
  // not <input type="time">, which opens a clock picker on mobile.
  function tplTimeSelect(id, part, hm){
    var cur = String(hm||'').split(':');
    var sel = part === 'h' ? (cur[0]||'10') : (cur[1]||'00');
    var html = '<select id="'+id+'">';
    if(part === 'h'){
      for(var h=0; h<24; h++){
        var hv = pad2(h);
        html += '<option value="'+hv+'"'+(hv===sel?' selected':'')+'>'+hv+'</option>';
      }
    } else {
      for(var m=0; m<60; m+=5){
        var mv = pad2(m);
        html += '<option value="'+mv+'"'+(mv===sel?' selected':'')+'>'+mv+'</option>';
      }
    }
    return html + '</select>';
  }

  // A suggestion list anchored right under the input. Native <datalist> puts
  // its options in the keyboard strip on Android, far from the field, so this
  // is built by hand. It never calls render(), so Korean IME composition in
  // the input is never interrupted.
  function attachAutocomplete(inputId, boxId, getItems, onPick){
    var input = document.getElementById(inputId);
    var box = document.getElementById(boxId);
    if(!input || !box) return;

    var close = function(){ box.hidden = true; box.innerHTML = ''; };
    var open = function(){
      var q = nameKey(input.value);
      var seen = {}, items = [];
      getItems().forEach(function(s){
        var k = nameKey(s);
        if(!k || seen[k]) return;
        if(q && k.indexOf(q) === -1) return;
        seen[k] = true;
        if(items.length < 8) items.push(s);
      });
      if(!items.length || (items.length === 1 && nameKey(items[0]) === q)){ close(); return; }
      box.innerHTML = '';
      items.forEach(function(s){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'ac-item';
        b.textContent = s;
        // mousedown would blur the input first and close the list before click
        b.addEventListener('mousedown', function(ev){ ev.preventDefault(); });
        b.addEventListener('click', function(){
          input.value = s;
          close();
          if(onPick) onPick(s);
        });
        box.appendChild(b);
      });
      box.hidden = false;
    };

    input.addEventListener('focus', open);
    input.addEventListener('input', open);
    input.addEventListener('blur', function(){ setTimeout(close, 180); });
    input.addEventListener('keydown', function(ev){ if(ev.key === 'Escape') close(); });
  }

  /* ---------------- templates: 회원(내담자) 관리 ---------------- */

    return state.clients.slice().sort(function(a,b){
      return String(a.name||'').localeCompare(String(b.name||''), 'ko');
    });
  }
  function clientSessionTotal(c){
    if(!c) return 0;
    var k = 'c:'+c.id;
    var n = priorOf(c);
    state.entries.forEach(function(e){ if(clientKey(e)===k) n++; });
    return n;
  }
  // 앱에 등록된 일정만 (사전 횟수 제외)
  function clientEntryCount(c){
    if(!c) return 0;
    var k = 'c:'+c.id;
    var n = 0;
    state.entries.forEach(function(e){ if(clientKey(e)===k) n++; });
    return n;
  }

  function tplBirthSelects(birth){
    var parts = String(birth||'').split('-');
    var by = parts[0]||'', bm = parts[1]||'', bd = parts[2]||'';
    var thisYear = today.getFullYear();

    var html = '<select id="cl-birth-y"><option value="">년</option>';
    for(var y = thisYear; y >= thisYear-100; y--){
      html += '<option value="'+y+'"'+(String(y)===by?' selected':'')+'>'+y+'</option>';
    }
    html += '</select>';

    html += '<select id="cl-birth-m"><option value="">월</option>';
    for(var m = 1; m <= 12; m++){
      html += '<option value="'+pad2(m)+'"'+(pad2(m)===bm?' selected':'')+'>'+m+'</option>';
    }
    html += '</select>';

    var maxDay = (by && bm) ? daysInMonth(parseInt(by,10), parseInt(bm,10)) : 31;
    html += '<select id="cl-birth-d"><option value="">일</option>';
    for(var d = 1; d <= maxDay; d++){
      html += '<option value="'+pad2(d)+'"'+(pad2(d)===bd?' selected':'')+'>'+d+'</option>';
    }
    html += '</select>';
    return html;
  }
