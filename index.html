  /* ---------------- templates: 게시판 ---------------- */
  function boardById(id){
    for(var i=0;i<state.boards.length;i++) if(state.boards[i].id===id) return state.boards[i];
    return null;
  }
  function postById(id){
    for(var i=0;i<state.posts.length;i++) if(state.posts[i].id===id) return state.posts[i];
    return null;
  }
  // 관리자가 정한 순서(order)를 따르고, 아직 순서가 없는 예전 게시판은
  // 만들어진 순으로 뒤에 붙어요. 한 번 순서를 바꾸면 전부 정리돼요.
  function boardsSorted(){
    return state.boards.slice().sort(function(a,b){
      var ao = typeof a.order === 'number' ? a.order : 99999;
      var bo = typeof b.order === 'number' ? b.order : 99999;
      if(ao !== bo) return ao - bo;
      return String(a.createdAt||'').localeCompare(String(b.createdAt||''));
    });
  }

  function moveBoard(id, dir){
    var list = boardsSorted();
    var i = -1;
    for(var k=0;k<list.length;k++) if(list[k].id===id){ i = k; break; }
    var j = i + dir;
    if(i < 0 || j < 0 || j >= list.length) return;
    var swap = list[i]; list[i] = list[j]; list[j] = swap;

    // Write the normalised positions one at a time — only the rows that
    // actually moved, which also backfills any board created before ordering.
    var chain = Promise.resolve();
    list.forEach(function(b, idx){
      if(b.order !== idx){
        chain = chain.then(function(){
          return state.db.collection('boards').doc(b.id).update({ order: idx });
        });
      }
    });
    chain.catch(function(){});
  }

  var PIN_LIMIT = 5;          // 게시판당 상단 고정 글 최대 개수
  var NAME_CHIP_MAX = 4;      // 이날까지는 이름으로, 넘으면 상담사별 인원 요약으로
  var SUM_ROW_MAX = 4;        // 요약에서 보여줄 상담사 줄 수

  function postsOfBoard(boardId){
    var all = state.posts.filter(function(p){ return p.boardId===boardId; });
    var byNewest = function(a,b){ return String(b.createdAt||'').localeCompare(String(a.createdAt||'')); };
    // 최근에 고정한 글이 위로 — 5개를 넘길 때 밀려나는 순서와 같은 기준이에요.
    var pinned = all.filter(function(p){ return !!p.pinned; })
      .sort(function(a,b){ return String(b.pinnedAt||'').localeCompare(String(a.pinnedAt||'')); });
    var rest = all.filter(function(p){ return !p.pinned; }).sort(byNewest);
    return pinned.concat(rest);
  }
  // 게시판 목록의 "최근"은 고정과 무관하게 가장 나중에 올라온 글 기준이에요.
  function latestPostOf(boardId){
    return state.posts.filter(function(p){ return p.boardId===boardId; })
      .sort(function(a,b){ return String(b.createdAt||'').localeCompare(String(a.createdAt||'')); })[0];
  }
  function pinnedOfBoard(boardId){
    return state.posts.filter(function(p){ return p.boardId===boardId && p.pinned; })
      .sort(function(a,b){ return String(a.pinnedAt||'').localeCompare(String(b.pinnedAt||'')); });  // 오래된 순
  }
  // 글쓰기 제한이 걸린 게시판(공지사항 등)은 관리자와 권한 있는 구성원만 써요.
  function canWriteBoard(b){ return !!b && (!b.writeRestricted || canManageSchedule()); }
  function canEditPost(p){
    if(!p || !state.account) return false;
    return p.authorId === state.account.id || canManageSchedule();
  }
  function fmtDateTime(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso).slice(0,10);
    return (d.getMonth()+1)+'/'+d.getDate()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
  }

  /* ---------------- templates: settings (admin) ---------------- */
  /* ---------------- 일정 내려받기 (관리자 전용) ---------------- */
  var DOW_KO = ['일','월','화','수','목','금','토'];

  function exportTarget(){
    return {
      y: state.exportYear == null ? state.view.year : state.exportYear,
      m: state.exportMonth == null ? state.view.month : state.exportMonth
    };
  }
  // 그 달 일정 (화면 필터와 무관하게 센터 전체)
  function entriesOfMonth(y, m){
    var prefix = y + '-' + pad2(m+1);
    return state.entries.filter(function(e){
      return String(e.date||'').slice(0,7) === prefix;
    }).sort(function(a,b){
      var d = String(a.date||'').localeCompare(String(b.date||''));
      return d !== 0 ? d : String(a.start||'').localeCompare(String(b.start||''));
    });
  }
  function exportYears(){
    var years = {};
    state.entries.forEach(function(e){
      var y = parseInt(String(e.date||'').slice(0,4), 10);
      if(y) years[y] = true;
    });
    var now = new Date().getFullYear();
    years[now] = true; years[now-1] = true; years[now+1] = true;
    years[state.view.year] = true;
    return Object.keys(years).map(Number).sort(function(a,b){ return b-a; });
  }

  function entryLine(e){
    var t = (e.start||'').slice(0,5);
    var s = sessionMap[e.id];
    var line = (t ? t + ' ' : '') + (e.title || '(이름 없음)');
    if(s && s.total > 1) line += ' ' + s.n + '회';
    var who = e.counselorName || (memberById(e.counselorId) || {}).name || '';
    if(who) line += ' / ' + who;
    return line;
  }

  function buildMonthSheets(y, m){
    var list = entriesOfMonth(y, m);
    var orgName = (orgAdminInfo() || {}).orgName || '상담센터';
    var byDate = {};
    list.forEach(function(e){ (byDate[e.date] = byDate[e.date] || []).push(e); });

    /* --- 1. 달력 --- */
    var firstDow = new Date(y, m, 1).getDay();
    var lastDay = new Date(y, m+1, 0).getDate();
    var prevLast = new Date(y, m, 0).getDate();
    var weeks = Math.ceil((firstDow + lastDay) / 7);

    var rows = [];
    rows.push({ h:28, cells:[{ v: orgName + ' · ' + y + '년 ' + (m+1) + '월 상담 일정', s:'title', span:7 }] });
    rows.push({ h:16, cells:[{
      v: '총 ' + list.length + '건 · 내담자 ' + countClients(list) + '명 · ' +
         new Date().getFullYear() + '-' + pad2(new Date().getMonth()+1) + '-' + pad2(new Date().getDate()) + ' 기준',
      s:'sub', span:7 }] });
    rows.push({ h:22, cells: DOW_KO.map(function(d, i){
      return { v:d, s: i===0 ? 'wheadSun' : (i===6 ? 'wheadSat' : 'whead') };
    }) });

    for(var w=0; w<weeks; w++){
      var cells = [], maxLines = 0;
      for(var i=0; i<7; i++){
        var idx = w*7 + i;
        var dayNum = idx - firstDow + 1;
        var inMonth = dayNum >= 1 && dayNum <= lastDay;
        var shown = inMonth ? dayNum : (dayNum < 1 ? prevLast + dayNum : dayNum - lastDay);
        var dateStr = inMonth ? fmtDate(y, m, dayNum) : '';
        var hol = inMonth ? holidayOf(dateStr) : '';
        var dayEntries = (inMonth && byDate[dateStr]) ? byDate[dateStr] : [];

        var numColor = !inMonth ? 'FF7A7368'
          : (i===0 || hol) ? 'FFC0392B'
          : (i===6 ? 'FF2C6FBF' : 'FF2E2B26');
        var runs = [{ t:String(shown), b:true, sz:10, color:numColor }];
        if(hol) runs.push({ t:'\n'+hol, b:true, sz:8, color:'FF8A6A1F' });
        dayEntries.forEach(function(e){ runs.push({ t:'\n'+entryLine(e), sz:8 }); });

        var style = !inMonth ? 'dayOut'
          : hol ? 'dayHol'
          : (i===0 ? 'daySun' : (i===6 ? 'daySat' : 'day'));
        cells.push({ s:style, runs:runs });
        maxLines = Math.max(maxLines, runs.length);
      }
      // 줄 수에 맞춰 세로로만 늘립니다 (엑셀 최대 행 높이 409)
      rows.push({ h: Math.min(409, Math.max(52, 14 + maxLines * 11)), cells:cells });
    }

    var calendar = { name:'달력', landscape:true, cols:[26,26,26,26,26,26,26], rows:rows };

    /* --- 2. 상담사별 집계 ---
       하루 한 칸씩 1일부터 말일까지 늘어놓고, 상담사마다
       "전체" 한 줄 + 상담타입마다 한 줄로 세어줍니다.
       상담타입은 내담자 정보에 붙어 있고, 권한자만 볼 수 있어요. */
    var dayCols = [];
    for(var dd = 1; dd <= lastDay; dd++) dayCols.push(dd);

    // 이 달에 쓰인 상담타입 모으기
    var typeSet = {}, hasNoType = false;
    list.forEach(function(e){
      var t = typeOf(clientForEntry(e));
      if(t) typeSet[t] = true; else hasNoType = true;
    });
    var typeList = Object.keys(typeSet).sort(function(a,b){ return a.localeCompare(b, 'ko'); });
    if(hasNoType) typeList.push(NO_TYPE);

    // 상담사 -> 타입 -> 날짜 -> 건수
    function emptyTally(){
      var t = { all: {}, sum: 0, byType: {} };
      typeList.forEach(function(ty){ t.byType[ty] = { days:{}, sum:0 }; });
      return t;
    }
    var tally = {}, order = [];
    function bucket(name){
      if(!tally[name]){ tally[name] = emptyTally(); order.push(name); }
      return tally[name];
    }
    // 활동 중인 구성원은 일정이 없어도 줄을 만들어둡니다 (급여 확인용)
    state.members.filter(function(m){ return m.active !== false; })
      .forEach(function(m){ bucket(m.name); });

    var centerTotal = emptyTally();
    list.forEach(function(e){
      var who = e.counselorName || (memberById(e.counselorId)||{}).name || '(담당 미지정)';
      var ty = typeOf(clientForEntry(e)) || NO_TYPE;
      var d = parseInt(String(e.date||'').slice(8,10), 10);
      if(!d) return;
      [bucket(who), centerTotal].forEach(function(t){
        t.all[d] = (t.all[d]||0) + 1;
        t.sum++;
        var bt = t.byType[ty];
        if(bt){ bt.days[d] = (bt.days[d]||0) + 1; bt.sum++; }
      });
    });

    // 구분 + 날짜들 + 합계 + 단가 + 금액
    var WIDTH = 1 + dayCols.length + 3;
    var COL_SUM   = colLetter(1 + dayCols.length);
    var COL_PRICE = colLetter(2 + dayCols.length);
    var COL_MONEY = colLetter(3 + dayCols.length);

    var aggRows = [];
    aggRows.push({ h:26, cells:[{ v: orgName + ' · ' + y + '년 ' + (m+1) + '월 상담사별 집계', s:'title', span:WIDTH }] });
    aggRows.push({ h:16, cells:[{ v:'상담타입별로 몇 회씩 진행했는지 하루 단위로 나눠 적었어요. 빈 칸은 0회입니다.', s:'sub', span:WIDTH }] });
    aggRows.push({ h:16, cells:[{ v:'노란 칸(맨 위 "센터 전체"의 단가)에 금액을 넣으면 아래 상담사 표에도 같이 반영되고, 금액이 자동으로 계산됩니다.', s:'sub', span:WIDTH }] });

    function headRow(){
      var cells = [{ v:'구분', s:'th' }];
      dayCols.forEach(function(d){
        var dow = new Date(y, m, d).getDay();
        cells.push({ v:d, s: dow===0 ? 'dayheadSun' : (dow===6 ? 'dayheadSat' : 'dayhead') });
      });
      cells.push({ v:'합계', s:'th' });
      cells.push({ v:'단가', s:'th' });
      cells.push({ v:'금액', s:'th' });
      return { h:20, cells:cells };
    }

    // 센터 전체 표의 단가 칸 위치를 기억해뒀다가, 아래 상담사 표들이 그 값을 끌어다 씁니다.
    var masterPriceRow = {};

    function block(title, t, isMaster){
      aggRows.push({ cells:[] });                       // 한 줄 띄우기
      aggRows.push({ h:22, cells:[{ v:title, s:'blockhead', span:WIDTH }] });
      aggRows.push(headRow());

      var totalRowNo = aggRows.length + 1;              // 곧 넣을 "전체" 줄의 엑셀 행 번호
      var firstTypeRow = totalRowNo + 1;
      var lastTypeRow  = totalRowNo + typeList.length;

      // 전체 줄 — 금액은 아래 타입 줄들의 합
      var totalCells = [{ v:'전체', s:'rowhead' }];
      dayCols.forEach(function(d){
        totalCells.push({ v: t.all[d] || '', s:'sumcell' });
      });
      totalCells.push({ v:t.sum, s:'sumcell' });
      totalCells.push({ v:'', s:'sumcell' });
      totalCells.push(typeList.length
        ? { f:'SUM('+COL_MONEY+firstTypeRow+':'+COL_MONEY+lastTypeRow+')', s:'moneySum' }
        : { v:'', s:'moneySum' });
      aggRows.push({ cells:totalCells });

      typeList.forEach(function(ty, i){
        var rowNo = firstTypeRow + i;
        var bt = t.byType[ty];
        var cells = [{ v:ty, s:'td' }];
        dayCols.forEach(function(d){
          cells.push({ v: bt.days[d] || '', s:'tdC' });
        });
        cells.push({ v:bt.sum, s:'sumcell' });
        if(isMaster){
          masterPriceRow[ty] = rowNo;
          cells.push({ v:'', s:'priceIn' });            // 여기에 단가를 적습니다
        } else {
          cells.push({ f:'$'+COL_PRICE+'$'+masterPriceRow[ty], s:'priceRef' });
        }
        cells.push({ f:COL_SUM+rowNo+'*'+COL_PRICE+rowNo, s:'money' });
        aggRows.push({ cells:cells });
      });
    }

    block('센터 전체', centerTotal, true);
    order.forEach(function(name){ block(name, tally[name], false); });

    var aggCols = [14];
    dayCols.forEach(function(){ aggCols.push(3.4); });
    aggCols.push(7); aggCols.push(11); aggCols.push(13);
    var agg = { name:'상담사별 집계', landscape:true, cols:aggCols, rows:aggRows };

    return [calendar, agg];
  }

  function countClients(list){
    var seen = {};
    list.forEach(function(e){ var k = clientKey(e); if(k) seen[k] = true; });
    return Object.keys(seen).length;
  }

  // 0 -> A, 26 -> AA (엑셀 열 이름)
  function colLetter(n){
    var out = '';
    n = n + 1;
    while(n > 0){ var r = (n - 1) % 26; out = String.fromCharCode(65 + r) + out; n = ((n - r) / 26) | 0; }
    return out;
  }

  function saveBytes(bytes, filename){
    var blob = new Blob([bytes], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 2000);
  }

  function bindEditModal(){

    if(!overlay) return;
    overlay.addEventListener('click', function(ev){ if(ev.target===overlay){ state.editEntry=null; render(); } });
    var closeBtn = document.getElementById('edit-close');
    if(closeBtn) closeBtn.addEventListener('click', function(){ state.editEntry=null; render(); });

    var delBtn = document.getElementById('edit-delete');
    if(delBtn) delBtn.addEventListener('click', function(){
      var entryId = state.editEntry.id;
      askConfirm({
        title:'일정 삭제', message:'이 일정을 삭제할까요?', okLabel:'삭제',
        onOk: function(){
          state.db.collection('schedule').doc(entryId).delete().then(function(){
            state.editEntry=null; state.dayModal=null; render();
          }).catch(function(){});
        }
      });
    });

    var delSeriesBtn = document.getElementById('edit-delete-series');
    if(delSeriesBtn) delSeriesBtn.addEventListener('click', function(){
      var sid = state.editEntry && state.editEntry.seriesId;
      if(!sid) return;
      var targets = state.entries.filter(function(e){ return e.seriesId===sid; });
      askConfirm({
        title:'반복 일정 전체 삭제',
        message:'이 반복 일정 '+targets.length+'회를 모두 삭제할까요? 되돌릴 수 없어요.',
        okLabel:'전체 삭제',
        onOk: function(){
          var chain = Promise.resolve();
          targets.forEach(function(e){
            chain = chain.then(function(){ return state.db.collection('schedule').doc(e.id).delete(); });
          });
          chain.then(function(){
            state.editEntry=null; state.dayModal=null; render();
          }).catch(function(){
            var errEl = document.getElementById('edit-err');
            if(errEl){ errEl.textContent='일부 일정을 삭제하지 못했어요. 다시 시도해주세요.'; errEl.hidden=false; }
          });
        }
      });
    });

    /* --- 내담자 연결 --- */
    var counselorSel = document.getElementById('ef-counselor');
    var titleEl = document.getElementById('ef-title');
    var applyClientLink = function(value){
      state.editEntry.title = value;
      var cl = clientByName(value);
      // A registered client carries their 담당 상담사 across automatically.
      // Set it on the element before re-rendering, since form state captured
      // at render time is what wins afterwards.
      if(cl && cl.counselorId && counselorSel){
        var hasOption = Array.prototype.some.call(counselorSel.options, function(o){ return o.value===cl.counselorId; });
        if(hasOption) counselorSel.value = cl.counselorId;
      }
      // 사전 방문 횟수도 그 내담자에게 저장된 값으로 맞춰둡니다. 같은 이유로
      // 화면을 다시 그리기 전에 입력칸에 직접 넣어야 살아남아요.
      var pe = document.getElementById('ef-prior');
      if(pe) pe.value = (cl && priorOf(cl)) ? priorOf(cl) : '';
      // `change` on a text input fires mid-blur; rebuilding the DOM right then
      // throws ("node to be removed is no longer a child"). Let blur finish.
      setTimeout(render, 0);
    };
    if(titleEl) titleEl.addEventListener('change', function(){ applyClientLink(titleEl.value); });

    attachAutocomplete('ef-title', 'ef-title-ac', function(){
      return clientsSorted().map(function(cl){ return cl.name; });
    }, applyClientLink);

    /* --- 반복 설정 --- */
    var dateEl = document.getElementById('ef-date');
    if(dateEl) dateEl.addEventListener('change', function(){
      state.editEntry.date = dateEl.value;
      // while the weekday list is still the untouched default, follow the date
      if(state.repeatDows.length <= 1){
        var d = dateFromStr(dateEl.value);
        if(d) state.repeatDows = [d.getDay()];
      }
      render();
    });

    /* --- 사전 방문 / 최종 방문 --- */
    var priorEl = document.getElementById('ef-prior');
    var finalEl = document.getElementById('ef-final');
    // 사용자가 직접 고친 적이 있으면 그 값을 건드리지 않습니다.
    // 화면을 다시 그려도 유지돼야 해서 state 에 둡니다.
    var syncFinal = function(){
      // 창이 닫힌 뒤에 한 박자 늦게 불릴 수 있어서 매번 확인합니다
      var titleNow = document.getElementById('ef-title');
      if(!finalEl || !finalEl.isConnected || !titleNow) return;
      var linkedNow = clientByName(titleNow.value.trim());
      if(!linkedNow){ finalEl.textContent = '—'; return; }
      // 이름을 치는 중에 내담자가 잡히면, 그 사람에게 저장된 사전 횟수를 채워줍니다.
      // (화면을 다시 그리지 않아요 — 한글 입력이 끊기지 않게)
      if(priorEl && !state.priorTouched){
        priorEl.value = priorOf(linkedNow) ? priorOf(linkedNow) : '';
      }
      var typed = priorEl ? parseInt(priorEl.value, 10) : NaN;
      var prior = isNaN(typed) || typed < 0 ? 0 : typed;
      finalEl.textContent = (prior + clientEntryCount(linkedNow) + state.repeatCount) + '회';
    };
    if(priorEl) priorEl.addEventListener('input', function(){ state.priorTouched = true; syncFinal(); });
    if(titleEl) titleEl.addEventListener('input', syncFinal);
    // 입력값 복원(applyFormState)은 이 함수가 끝난 뒤에 일어나요. 그래서 한 박자 뒤에도 한 번 더.
    syncFinal();
    setTimeout(syncFinal, 0);

    var repeatEl = document.getElementById('ef-repeat');
    if(repeatEl) repeatEl.addEventListener('change', function(){
      state.repeatCount = parseInt(repeatEl.value, 10) || 1;
      if(state.repeatCount > 1 && !state.repeatDows.length){
        var d = dateFromStr(state.editEntry.date);
        if(d) state.repeatDows = [d.getDay()];
      }
      render();
    });

    document.querySelectorAll('[data-dow]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-dow'), 10);
        var at = state.repeatDows.indexOf(i);
        if(at === -1) state.repeatDows.push(i); else state.repeatDows.splice(at, 1);
        state.repeatDows.sort();
        render();
      });
    });

    /* --- 시작 / 소요 / 종료 시간 연동 --- */
    var sh = document.getElementById('ef-start-h'), sm = document.getElementById('ef-start-m');
    var eh = document.getElementById('ef-end-h'), em = document.getElementById('ef-end-m');
    var durEl = document.getElementById('ef-dur');
    var startMinutes = function(){ return parseInt(sh.value,10)*60 + parseInt(sm.value,10); };
    var endMinutes = function(){ return parseInt(eh.value,10)*60 + parseInt(em.value,10); };
    var writeEnd = function(total){
      var hm = minToHM(total).split(':');
      eh.value = hm[0]; em.value = hm[1];
    };
    var applyDuration = function(){
      var d = parseInt(durEl.value, 10);
      if(isNaN(d)) return;            // "직접 지정" — leave the end time alone
      writeEnd(startMinutes() + d);
    };
    var refreshDuration = function(){
      var diff = endMinutes() - startMinutes();
      if(diff < 0) diff += 1440;
      durEl.value = DURATIONS.indexOf(diff) !== -1 ? String(diff) : 'custom';
    };
    if(durEl) durEl.addEventListener('change', applyDuration);
    [sh, sm].forEach(function(el){ if(el) el.addEventListener('change', applyDuration); });
    [eh, em].forEach(function(el){ if(el) el.addEventListener('change', refreshDuration); });

    var saveBtn = document.getElementById('edit-save');
    saveBtn.addEventListener('click', function(){
      var errEl = document.getElementById('edit-err');
      var fail = function(msg){ errEl.textContent = msg; errEl.hidden = false; };
      var date = document.getElementById('ef-date').value;
      var start = minToHM(startMinutes());
      var end = minToHM(endMinutes());
      var title = document.getElementById('ef-title').value.trim();
      var memo = document.getElementById('ef-memo').value.trim();
      var counselorId = counselorSel ? counselorSel.value : state.account.id;

      if(!date){ return fail('날짜를 선택해주세요.'); }
      if(!title){ return fail('제목을 입력해주세요.'); }
      if(!counselorId){ return fail('구성원을 선택해주세요. 먼저 조직도에서 구성원을 추가해주세요.'); }
      if(endMinutes() <= startMinutes()){ return fail('종료 시간은 시작 시간보다 늦어야 해요.'); }

      var isNew = !state.editEntry.id;
      var dates = (isNew && state.repeatCount > 1)
        ? repeatDates(date, state.repeatDows, state.repeatCount)
        : [date];
      if(!dates.length){ return fail('반복할 요일을 하나 이상 선택해주세요.'); }

      var c = memberById(counselorId);
      var linkedClient = clientByName(title);

      // 사전 방문 횟수는 내담자 정보에 저장합니다 (일정마다 따로 두면 어긋나요)
      var priorWrite = Promise.resolve();
      if(isNew && priorEl){
        var typedPrior = parseInt(priorEl.value, 10);
        typedPrior = isNaN(typedPrior) || typedPrior < 0 ? 0 : typedPrior;
        if(typedPrior > 0 && !linkedClient){
          return fail('사전 방문 횟수는 회원 관리에 등록된 내담자만 저장할 수 있어요. 이름을 확인하거나 사전 방문을 비워주세요.');
        }
        if(linkedClient && typedPrior !== priorOf(linkedClient)){
          priorWrite = state.db.collection('clients').doc(linkedClient.id)
            .update({ priorSessions: typedPrior }).catch(function(){});
        }
      }
      var payload = {
        orgId: myOrgId(),
        counselorId: counselorId,
        counselorName: c ? c.name : (state.account.name||''),
        clientId: linkedClient ? linkedClient.id : '',
        date: date, start:start, end:end, title:title, memo:memo,
        updatedAt: new Date().toISOString()
      };

      state.editSaving = true;
      var done = function(){
        state.editSaving = false;
        state.editEntry = null;
        state.repeatCount = 1; state.repeatDows = [];
        if(dates.length > 1){
          // Most of a series lands on other days (and often the next month),
          // so drop back to the calendar and say what was actually created —
          // otherwise only the one entry on this day is visible and it looks
          // like the repeat never applied.
          state.dayModal = null;
          showToast(dates.length+'회 일정을 등록했어요 · '+shortDate(dates[0])+' ~ '+shortDate(dates[dates.length-1]));
          return;
        }
        render();
      };
      var failed = function(){
        state.editSaving = false;
        fail('저장에 실패했어요. 다시 시도해주세요.');
      };

      if(!isNew){
        state.db.collection('schedule').doc(state.editEntry.id).update(payload).then(done).catch(failed);
        return;
      }

      // Repeats are written one after another rather than all at once, so a
      // 20-session series doesn't trip the store's concurrent-write budget.
      var seriesId = dates.length > 1
        ? ('s' + Date.now().toString(36) + Math.random().toString(36).slice(2,8))
        : null;
      var chain = priorWrite;
      dates.forEach(function(d){
        chain = chain.then(function(){
          var body = Object.assign({ createdAt:new Date().toISOString() }, payload, { date:d });
          if(seriesId) body.seriesId = seriesId;
          return state.db.collection('schedule').doc().set(body);
        });
      });
      chain.then(done).catch(failed);
    });
  }

  function applyClientFilter(){
    var q = nameKey(state.clientSearch);
    var qDigits = q.replace(/\D/g,'');
    var anyShown = false;
    document.querySelectorAll('.client-card').forEach(function(card){
      var c = clientById(card.getAttribute('data-clientid'));
      var show = !q || !!(c && (
        nameKey(c.name).indexOf(q) !== -1 ||
        nameKey(c.guardian).indexOf(q) !== -1 ||
        (!!qDigits && normPhone(c.phone).indexOf(qDigits) !== -1)
      ));
      card.hidden = !show;
      if(show) anyShown = true;
    });
    var none = document.getElementById('client-none');
    if(none) none.hidden = anyShown || !document.querySelectorAll('.client-card').length;
  }

  function bindClientEditModal(){
    var overlay = document.getElementById('client-overlay');
    if(!overlay) return;
    var editing = state.clientEdit;
    var close = function(){ state.clientEdit = null; state.clientError=''; render(); };
    overlay.addEventListener('click', function(ev){ if(ev.target===overlay) close(); });
    var closeBtn = document.getElementById('client-close');
    if(closeBtn) closeBtn.addEventListener('click', close);

    // Rebuild the day list in place when year/month change, so February and
    // 30-day months never offer a date that doesn't exist.
    var byEl = document.getElementById('cl-birth-y');
    var bmEl = document.getElementById('cl-birth-m');
    var bdEl = document.getElementById('cl-birth-d');
    var syncBirthDays = function(){
      if(!byEl || !bmEl || !bdEl) return;
      var y = parseInt(byEl.value,10), m = parseInt(bmEl.value,10);
      var max = (y && m) ? daysInMonth(y, m) : 31;
      var cur = parseInt(bdEl.value,10);
      var opts = '<option value="">일</option>';
      for(var d = 1; d <= max; d++){
        opts += '<option value="'+pad2(d)+'"'+(d===cur?' selected':'')+'>'+d+'</option>';
      }
      bdEl.innerHTML = opts;
      if(cur && cur > max) bdEl.value = '';
    };
    // 연·월·일을 고르면 만 나이를 바로 옆에 띄워줍니다 (화면을 다시 그리지 않고).
    var syncAge = function(){
      var el = document.getElementById('cl-age');
      if(!el || !byEl || !bmEl || !bdEl) return;
      var txt = (byEl.value && bmEl.value && bdEl.value)
        ? ageText(byEl.value + '-' + bmEl.value + '-' + bdEl.value) : '';
      el.textContent = txt;
      el.hidden = !txt;
    };
    [byEl, bmEl].forEach(function(el){
      if(el) el.addEventListener('change', function(){ syncBirthDays(); syncAge(); });
    });
    if(bdEl) bdEl.addEventListener('change', syncAge);

    attachAutocomplete('cl-type', 'cl-type-ac', typeSuggestions);

    var delBtn = document.getElementById('client-delete');
    if(delBtn) delBtn.addEventListener('click', function(){
      askConfirm({
        title:'내담자 삭제',
        message:(editing.name||'이 내담자')+' 정보를 삭제할까요?\n\n등록된 상담 일정은 지워지지 않고 그대로 남아요.',
        okLabel:'삭제',
        onOk: function(){
          state.db.collection('clienttypes').doc(editing.id).delete().catch(function(){})
            .then(function(){
              return state.db.collection('clients').doc(editing.id).delete();
            }).then(function(){
              state.clientEdit = null; render();
            }).catch(function(){});
        }
      });
    });

    var saveBtn = document.getElementById('client-save');
    if(saveBtn) saveBtn.addEventListener('click', function(){
      var name = document.getElementById('cl-name').value.trim();
      if(!name){ state.clientError='내담자 이름을 입력해주세요.'; render(); return; }

      var dup = clientByName(name);
      if(dup && dup.id !== editing.id){
        state.clientError = '같은 이름의 내담자가 이미 등록돼 있어요.';
        render(); return;
      }

      var by = byEl.value, bm = bmEl.value, bd = bdEl.value;
      var filled = [by, bm, bd].filter(Boolean).length;
      if(filled > 0 && filled < 3){
        state.clientError = '생년월일은 연·월·일을 모두 선택하거나 모두 비워주세요.';
        render(); return;
      }

      var payload = {
        orgId: myOrgId(),
        name: name,
        birth: filled === 3 ? (by+'-'+bm+'-'+bd) : '',
        guardian: document.getElementById('cl-guardian').value.trim(),
        phone: document.getElementById('cl-phone').value.trim(),
        email: document.getElementById('cl-email').value.trim(),
        gender: (document.getElementById('cl-gender')||{}).value || '',
        priorSessions: Math.max(0, parseInt((document.getElementById('cl-prior')||{}).value, 10) || 0),
        counselorId: document.getElementById('cl-counselor').value,
        memo: document.getElementById('cl-memo').value,
        updatedAt: new Date().toISOString()
      };

      var typeEl = document.getElementById('cl-type');
      var counselType = typeEl ? typeEl.value.trim() : '';

      state.clientBusy = true; state.clientError=''; render();

      var ref = editing.id
        ? state.db.collection('clients').doc(editing.id)
        : state.db.collection('clients').doc();
      var op = editing.id
        ? ref.update(payload)
        : ref.set(Object.assign({ createdAt:new Date().toISOString() }, payload));

      op.then(function(){
        // 상담타입은 별도 문서로. 비우면 문서를 지웁니다.
        var tref = state.db.collection('clienttypes').doc(ref.id);
        return counselType
          ? tref.set({ orgId: myOrgId(), clientId: ref.id, type: counselType,
                       updatedAt: new Date().toISOString() })
          : tref.delete().catch(function(){});
      }).then(function(){
        state.clientBusy = false; state.clientEdit = null; render();
      }).catch(function(){
        state.clientBusy = false; state.clientError='저장에 실패했어요. 다시 시도해주세요.'; render();
      });
    });
  }

      if(!p) return;
      askConfirm({
        title:'글 삭제', message:'이 글을 삭제할까요?', okLabel:'삭제',
        onOk: function(){
          // 글을 지우면 딸린 답글도 같이 지웁니다 (남으면 주인 없는 답글이 돼요)
          var kids = commentsOfPost(p.id);
          var chain = Promise.resolve();
          kids.forEach(function(c){
            chain = chain.then(function(){ return state.db.collection('comments').doc(c.id).delete(); });
          });
          chain.then(function(){
            return state.db.collection('posts').doc(p.id).delete();
          }).then(function(){
            state.postId = null; render();
          }).catch(function(){});
        }
      });
    });

    bindComments();
    bindPostEditModal();
    bindBoardEditModal();
  }

  function bindComments(){
    var submit = document.getElementById('cm-submit');
    if(submit) submit.addEventListener('click', function(){
      var ta = document.getElementById('cm-body');
      var body = ta ? ta.value.trim() : '';
      if(!body){
        state.commentError = '답글 내용을 입력해주세요.';
        render();
        var again = document.getElementById('cm-body');
        if(again) again.focus();
        return;
      }
      var p = postById(state.postId);
      if(!p || state.commentBusy) return;

      state.commentError = ''; state.commentBusy = true; render();
      state.db.collection('comments').doc().set({
        orgId: myOrgId(),
        postId: p.id,
        body: body,
        authorId: state.account.id,
        authorName: state.account.name || '',
        authorRole: myRoleText(),
        createdAt: new Date().toISOString()
      }).then(function(){
        state.commentBusy = false;
        // 비운 다음 그려야 입력칸이 되살아나지 않아요
        var el = document.getElementById('cm-body');
        if(el) el.value = '';
        render();
      }).catch(function(){
        state.commentBusy = false;
        state.commentError = '답글을 등록하지 못했어요. 다시 시도해주세요.';
        render();
      });
    });

    document.querySelectorAll('[data-cdel]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-cdel');
        askConfirm({
          title:'답글 삭제', message:'이 답글을 삭제할까요?', okLabel:'삭제',
          onOk: function(){
            state.db.collection('comments').doc(id).delete().catch(function(){});
          }
        });
      });
    });
  }

  function bindPostEditModal(){
    var overlay = document.getElementById('post-overlay');
    if(!overlay) return;
    var editing = state.postEdit;
    var close = function(){ state.postEdit=null; state.postError=''; render(); };
    overlay.addEventListener('click', function(ev){ if(ev.target===overlay) close(); });
    var closeBtn = document.getElementById('post-close');
    if(closeBtn) closeBtn.addEventListener('click', close);

    var saveBtn = document.getElementById('post-save');
    if(saveBtn) saveBtn.addEventListener('click', function(){
      var title = document.getElementById('po-title').value.trim();
      var body = document.getElementById('po-body').value;
      if(!title){ state.postError='제목을 입력해주세요.'; render(); return; }
      if(!body.trim()){ state.postError='내용을 입력해주세요.'; render(); return; }

      var board = boardById(editing.boardId);
      if(!canWriteBoard(board)){ state.postError='이 게시판에는 글을 쓸 수 없어요.'; render(); return; }

      var pinEl = document.getElementById('po-pin');
      var wantPin = !!(pinEl && pinEl.checked);

      state.postBusy = true; state.postError=''; render();
      var now = new Date().toISOString();

      // Keep the original pinnedAt when a post was already pinned, so simply
      // editing its text doesn't jump it above the other pinned ones.
      var pinnedAt = wantPin ? ((editing.pinned && editing.pinnedAt) ? editing.pinnedAt : now) : '';

      // Make room first: if the board is already at the limit, the oldest
      // pin is released before this one goes up.
      var release = [];
      if(wantPin){
        var others = pinnedOfBoard(editing.boardId).filter(function(p){ return p.id !== editing.id; });
        var overflow = others.length - (PIN_LIMIT - 1);
        if(overflow > 0) release = others.slice(0, overflow);
      }

      var chain = Promise.resolve();
      release.forEach(function(p){
        chain = chain.then(function(){
          return state.db.collection('posts').doc(p.id).update({ pinned:false, pinnedAt:'' });
        });
      });

      var op = chain.then(function(){
        if(editing.id){
          return state.db.collection('posts').doc(editing.id).update({
            title:title, body:body, pinned:wantPin, pinnedAt:pinnedAt, updatedAt:now
          });
        }
        return state.db.collection('posts').doc().set({
          orgId: myOrgId(), boardId: editing.boardId,
          title: title, body: body,
          pinned: wantPin, pinnedAt: pinnedAt,
          authorId: state.account.id, authorName: state.account.name || '',
          createdAt: now, updatedAt: now
        });
      });

      op.then(function(){
        state.postBusy = false; state.postEdit = null; render();
      }).catch(function(){
        state.postBusy = false; state.postError='저장에 실패했어요. 다시 시도해주세요.'; render();
      });
    });
  }

  function bindBoardEditModal(){
    var overlay = document.getElementById('boardedit-overlay');
    if(!overlay) return;
    var editing = state.boardEdit;
    var close = function(){ state.boardEdit=null; state.boardError=''; render(); };
    overlay.addEventListener('click', function(ev){ if(ev.target===overlay) close(); });
    var closeBtn = document.getElementById('boardedit-close');
    if(closeBtn) closeBtn.addEventListener('click', close);

    var delBtn = document.getElementById('boardedit-delete');
    if(delBtn) delBtn.addEventListener('click', function(){
      var posts = postsOfBoard(editing.id);
      askConfirm({
        title:'게시판 삭제',
        message:'"'+editing.name+'" 게시판을 삭제할까요?\n\n안에 있는 글 '+posts.length+'개도 함께 지워지고 되돌릴 수 없어요.',
        okLabel:'게시판 삭제',
        onOk: function(){
          var chain = Promise.resolve();
          posts.forEach(function(p){
            // 글에 딸린 답글을 먼저 지우고 글을 지웁니다
            commentsOfPost(p.id).forEach(function(c){
              chain = chain.then(function(){ return state.db.collection('comments').doc(c.id).delete(); });
            });
            chain = chain.then(function(){ return state.db.collection('posts').doc(p.id).delete(); });
          });
          chain.then(function(){
            return state.db.collection('boards').doc(editing.id).delete();
          }).then(function(){
            state.boardEdit=null; state.boardId=null; state.postId=null; render();
          }).catch(function(){
            state.boardError='삭제에 실패했어요. 다시 시도해주세요.'; render();
          });
        }
      });
    });

    var saveBtn = document.getElementById('boardedit-save');
    if(saveBtn) saveBtn.addEventListener('click', function(){
      var name = document.getElementById('bd-name').value.trim();
      var restrict = !!document.getElementById('bd-restrict').checked;
      if(!name){ state.boardError='게시판 이름을 입력해주세요.'; render(); return; }

      var dup = state.boards.filter(function(b){
        return nameKey(b.name)===nameKey(name) && b.id !== editing.id;
      })[0];
      if(dup){ state.boardError='같은 이름의 게시판이 이미 있어요.'; render(); return; }

      state.boardBusy = true; state.boardError=''; render();
      var op = editing.id
        ? state.db.collection('boards').doc(editing.id).update({ name:name, writeRestricted:restrict })
        : state.db.collection('boards').doc().set({
            orgId: myOrgId(), name:name, writeRestricted:restrict,
            order: state.boards.length, createdAt:new Date().toISOString()
          });
      op.then(function(){
        state.boardBusy = false; state.boardEdit = null; render();
      }).catch(function(){
        state.boardBusy = false; state.boardError='저장에 실패했어요. 다시 시도해주세요.'; render();
      });
    });
  }

  /* ---------------- bind: settings panel ---------------- */
  function bindSettingsPanel(){
    var saveBtn = document.getElementById('st-save');
    if(saveBtn) saveBtn.addEventListener('click', function(){
      var errEl = document.getElementById('st-err');
      var org = document.getElementById('st-org').value.trim();
      var name = document.getElementById('st-name').value.trim();
      var email = document.getElementById('st-email').value.trim();
      var emailLower = normEmail(email);
      var phone = document.getElementById('st-phone').value.trim();
      if(!org){ errEl.textContent='센터 이름을 입력해주세요.'; errEl.hidden=false; return; }
      if(!name){ errEl.textContent='이름을 입력해주세요.'; errEl.hidden=false; return; }
      if(!emailLower || emailLower.indexOf('@')<0){ errEl.textContent='올바른 이메일 주소를 입력해주세요.'; errEl.hidden=false; return; }

      state.settingsBusy = true; errEl.hidden=true; state.settingsMsg=''; render();
      var db = state.db;
      var myId = state.account.id;

      db.doc('accounts/'+myId).update({ orgName:org, name:name, email:email, emailLower:emailLower, phone:phone })
      .then(function(){
        // 관리자가 이메일이나 센터 이름을 바꾸면 열쇠 문서도 따라 옮겨줍니다
        if(!isAdmin()) return;
        return ensureOrgKey({ id:myId, email:email, orgName:org, orgEmailKey:state.account.orgEmailKey });
      }).then(function(){
        state.settingsBusy = false; state.settingsMsg = '저장했어요.'; render();
      }).catch(function(err){
        state.settingsBusy = false;
        document.getElementById('st-err').textContent = (err && err.code==='dup-email') ? '이미 사용 중인 이메일이에요.' : '저장에 실패했어요.';
        document.getElementById('st-err').hidden = false;
        render();
      });
    });

    var pwSaveBtn = document.getElementById('st-pw-save');
    if(pwSaveBtn) pwSaveBtn.addEventListener('click', function(){
      var errEl = document.getElementById('st-pw-err');
      var pw = document.getElementById('st-pw').value;
      var pw2 = document.getElementById('st-pw2').value;
      if(pw.length < MIN_PW){ errEl.textContent='비밀번호는 '+MIN_PW+'자 이상이어야 해요.'; errEl.hidden=false; return; }
      if(pw !== pw2){ errEl.textContent='비밀번호가 일치하지 않아요.'; errEl.hidden=false; return; }

      state.pwBusy = true; errEl.hidden=true; state.pwMsg=''; render();
      state.auth.updatePassword(pw).then(function(){
        state.pwBusy = false; state.pwMsg = '비밀번호를 변경했어요.'; render();
      }).catch(function(err){
        state.pwBusy = false;
        var el = document.getElementById('st-pw-err');
        if(el){
          el.textContent = authMessage(err, '변경에 실패했어요.');
          el.hidden = false;
        }
        render();
      });
    });
  }

  boot();
})();
</script>

<!-- 홈 화면 앱 설치를 위한 서비스워커. 항상 네트워크를 먼저 보고,
     연결이 없을 때만 저장해둔 화면을 씁니다. -->
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
</script>
